info:
  name: Get Categories
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE}}/categories"
  body:
    type: none
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Returns all course categories ordered alphabetically by name.

    **No parameters required.**

    **Success response (200):**
    ```json
    {
      "success": true,
      "data": [
        {
          "id": "uuid",
          "name": "Design",
          "slug": "design",
          "createdAt": "2024-01-01T00:00:00.000Z"
        }
      ]
    }
    ```
  type: text/markdown
