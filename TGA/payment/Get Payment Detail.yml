info:
  name: Get Payment Details
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE}}/payments/:paymentId"
  params:
    - name: paymentId
      value: "uuid"
      enabled: true
  body:
    type: none
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Gets the payment details of a particular payment by a user.

    **Auth:** Bearer token required.

    **Path parameters:**
    | Param | Type | Required |
    |-------|------|----------|
    | paymentId | string (UUID) | Yes |

    **Success response (200):**
    ```json
    {
      "message": "success"
      "data": {
        paymentDetails: {
          "courseId": "uuid",
          "paymentDate": "2026-06-25T00:00:00.000Z",
          "paymentMethod": "Free Enrollment",
          "transactionId": null,
          "status": "completed",
        },

        courseDetails: {
          courseTitle: "Software Development",
          courseInstructor: "TGA",
          duration: 130,
        },

        costOverview: {
          coursePrice: 0,
          totalAmount: 0,
        },
      }
    }
    ```

    **Errors:**
    - `400` — `paymentId` missing.
    - `401` — Unauthorized.
    - `404` — payment not found.
  type: text/markdown
