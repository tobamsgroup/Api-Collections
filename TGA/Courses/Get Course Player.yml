info:
  name: Get Course Player
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE}}/courses/:slug/player"
  params:
    - name: slug
      value: "example-course-slug"
      enabled: true
  body:
    type: none
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Returns the full module and lesson structure for a published course. Only accessible to enrolled users.

    **Auth:** Bearer token required.

    **Path parameters:**
    | Param | Type | Required |
    |-------|------|----------|
    | slug | string | Yes |

    **Success response (200):**
    ```json
    {
      "success": true,
      "data": {
        "courseId": "uuid",
        "courseTitle": "Course Title",
        "modules": [
          {
            "id": "uuid",
            "title": "Module 1",
            "position": 1,
            "lessons": [
              {
                "id": "uuid",
                "title": "Lesson 1",
                "position": 1,
                "duration": 300,
                "kind": "VIDEO",
                "contentKey": "s3-key",
                "contentUrl": "https://..."
              }
            ]
          }
        ]
      }
    }
    ```

    **Errors:**
    - `401` — Unauthorized.
    - `403` — Not enrolled in this course.
    - `404` — Course not found.
  type: text/markdown
