info:
  name: Get Course by Slug
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE}}/courses/:slug"
  params:
    - name: slug
      value: "example-course-slug"
      enabled: true
  body:
    type: none
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Returns full details for a single course identified by its slug, including all modules and lessons.

    **Path parameters:**
    | Param | Type | Required |
    |-------|------|----------|
    | slug | string | Yes |

    **Success response (200):**
    ```json
    {
      "success": true,
      "data": {
        "id": "uuid",
        "title": "Course Title",
        "slug": "course-title",
        "description": "...",
        "thumbnail": "https://...",
        "level": "INTERMEDIATE",
        "status": "PUBLISHED",
        "isFeatured": false,
        "price": "29.99",
        "category": { "id": "uuid", "name": "Design", "slug": "design" },
        "instructor": { "id": "uuid", "name": "Jane Smith", "email": "jane@example.com" },
        "modules": [
          {
            "id": "uuid",
            "title": "Module 1",
            "position": 1,
            "lessons": [
              { "id": "uuid", "title": "Lesson 1", "position": 1, "duration": 300 }
            ]
          }
        ]
      }
    }
    ```

    **Errors:**
    - `400` — Slug missing.
    - `404` — Course not found.
  type: text/markdown
