info:
  name: Change Password
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{BASE}}/users/me/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "OldPass123!",
        "newPassword": "NewPass456!"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Updates the authenticated user's password. Requires the current password to be supplied for verification.

    **Auth:** Bearer token required.

    **Body fields:**
    | Field | Type | Required |
    |-------|------|----------|
    | currentPassword | string | Yes |
    | newPassword | string | Yes — minimum 8 characters |

    **Success response (200):**
    ```json
    {
      "message": "Password updated successfully"
    }
    ```

    **Errors:**
    - `400` — `newPassword` too short, missing fields, or new password is the same as current.
    - `401` — Current password is incorrect or unauthorized.
  type: text/markdown
