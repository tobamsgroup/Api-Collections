info:
  name: Reset Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{BASE}}/auth/reset-password?token=<reset_token>"
  body:
    type: json
    data: |-
      {
        "password": "newpassword123"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Resets the user's password using the token received via email.

    **Query parameters:**
    | Param | Type | Required |
    |-------|------|----------|
    | token | string | Yes |

    **Body fields:**
    | Field | Type | Required | Notes |
    |-------|------|----------|-------|
    | password | string | Yes | Minimum 8 characters |

    **Responses:**
    - `200` — Password reset successfully.
    - `400` — Token missing or password too short.
    - `401` — Invalid or expired reset token.
  type: text/markdown
