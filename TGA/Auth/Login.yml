info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "john.doe@example.com",
        "password": "password123"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Authenticates a user with email and password. Returns access and refresh tokens.

    **Body fields:**
    | Field | Type | Required |
    |-------|------|----------|
    | email | string | Yes |
    | password | string | Yes |

    **Success response (200):**
    ```json
    {
      "success": true,
      "message": "Login successful",
      "data": {
        "accessToken": "<jwt>",
        "refreshToken": "<jwt>",
        "user": {
          "id": "uuid",
          "name": "John Doe",
          "email": "john.doe@example.com",
          "role": "LEARNER"
        }
      }
    }
    ```

    **Errors:**
    - `400` — Email or password missing.
    - `401` — Invalid credentials or email not verified.
  type: text/markdown
