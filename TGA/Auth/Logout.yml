info:
  name: Logout
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE}}/auth/logout"
  body:
    type: none
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Logs the user out. Token invalidation is handled client-side — discard the stored access and refresh tokens after calling this endpoint.

    **Auth:** Bearer token required.

    **Response (200):**
    ```json
    {
      "success": true,
      "message": "Logged out successfully"
    }
    ```
  type: text/markdown
