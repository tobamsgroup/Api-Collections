info:
  name: Forgot Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "john.doe@example.com"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Sends a password reset link to the provided email address if it exists in the system. Always returns the same safe message to prevent email enumeration.

    **Body fields:**
    | Field | Type | Required |
    |-------|------|----------|
    | email | string | Yes |

    **Response (200):**
    ```json
    {
      "success": true,
      "message": "If that email exists, a reset link has been sent"
    }
    ```

    The reset token expires after **1 hour**.
  type: text/markdown
