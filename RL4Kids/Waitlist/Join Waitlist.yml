info:
  name: Join Waitlist
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/waitlist"
  body:
    type: json
    data: |-
      {
        "firstName": "David",
        "lastName": "Mensah",
        "email": "david.mensah@example.com",
        "country": "Kenya",
        "interestedIn": ["Partnerships"],
        "bestOptionToDescribeWith": "Organisation / Partner",
        "organisationName": "EduReach Africa",
        "partnershipInterest": "Content Partnership",
        "howDidYouHear": "Search Engine",
        "agreeToReceiveUpdates": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

