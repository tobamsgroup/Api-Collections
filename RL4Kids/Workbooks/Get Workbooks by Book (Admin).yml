request:
  auth: inherit
info:
  name: Get Workbooks by Book (Admin)
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/workbooks/book/{{book_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Book with workbooks uploaded for all series
    request:
      url: "{{base_url}}/workbooks/book/6507f1f77bcf86cd799439000"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
