info:
  name: Get Notification Settings
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/notification-settings"
  auth:
    type: bearer
    token: "{{access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

