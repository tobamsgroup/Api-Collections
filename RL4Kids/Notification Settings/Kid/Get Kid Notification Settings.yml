info:
  name: Get Kid Notification Settings
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/kid-notification-settings"
  auth:
    type: bearer
    token: "{{access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

