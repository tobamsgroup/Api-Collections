info:
  name: Get Profile
  type: http
  seq: 11

http:
  method: GET
  url: "{{base_url}}/guardian/profile"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Profile summary for the signed-in guardian (Guardian token: parent or teacher). Adds counts to the account fields: `totalKids`, `activeTrackCount` (kids with at least one course) and `numOfBooks` (distinct books assigned), plus account-deletion state.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Profile
    request:
      url: "{{base_url}}/guardian/profile"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Guardian's Curriculum Stats fetched successfully",
            "timestamp": "2026-11-02T10:00:00.000Z",
            "path": "/api/v1/guardian/profile",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "firstName": "Abdulrasaq",
