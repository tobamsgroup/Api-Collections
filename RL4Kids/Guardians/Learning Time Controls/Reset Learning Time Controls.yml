info:
  name: Reset Learning Time Controls
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/guardian/learners/{{kid_id}}/learning-time-controls/reset"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Turn every control and notification off and restore the default values (Guardian token).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Controls reset
    request:
      url: "{{base_url}}/guardian/learners/6905e1c2a1b2c3d4e5f60789/learning-time-controls/reset"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Learning time controls reset",
            "timestamp": "2026-11-02T10:00:00.000Z",
            "path": "/api/v1/guardian/learners/6905e1c2a1b2c3d4e5f60789/learning-time-controls/reset",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "kidId": "6905e1c2a1b2c3d4e5f60789",
              "dailyLimit": {
                "enabled": false,
                "minutes": 30,
                "action": "pause"
              },
              "breakReminder": {
                "enabled": false,
                "intervalMinutes": 15
              },
              "schedule": {
                "enabled": false,
                "days": [
                  "mon",
                  "tue",
                  "wed",
                  "thu",
                  "fri"
                ],
                "startTime": "16:00",
                "endTime": "17:00"
              },
              "notifications": {
                "sessionStarted": false,
                "dailyLimitReached": false,
                "breakReminderSent": false
              }
            }
          }
