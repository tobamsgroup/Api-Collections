info:
  name: Get Assigned Books
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/guardian/learners/{{kid_id}}/books?search=&status=in_progress&categoryId=&page=1&limit=12"
  params:
    - name: search
      value: ""
      type: query
      disabled: true
    - name: status
      value: in_progress
      type: query
    - name: categoryId
      value: ""
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "12"
      type: query
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Assigned Books screen. Parent/Teacher only.

  Query params (all optional):
  - `search`: matches the book (series) title or category title, case-insensitive
  - `status`: not_started | in_progress | completed (omit for "All Books")
  - `categoryId`: Book id from `categories` (the "All Categories" dropdown)
  - `page` (default 1), `limit` (default 12, max 100)

  `counts` and `categories` always cover every assigned book, whatever the filters.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: In-progress books
    request:
      url: "{{base_url}}/guardian/learners/6acc6121a57282c78ac098ad/books?status=in_progress&page=1&limit=12"
      method: GET
