info:
  name: Get Reading Overview
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/guardian/learners/{{kid_id}}/reading-overview"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Learning Overview screen (Read Progress tab). Parent/Teacher only; 404 if the kid is not on the caller's account.

  - A "book" in the UI is a Series; `category` is the Book (e.g. Think AI).
  - `subscription.learningPaused` drives the "Learning is paused" banner.
  - `stats.streakDays` = consecutive days with reading time (feeds both Learning Streak and Reading Streak tiles).
  - `assignedBooks.items` and `exploreMore` are capped at 10; use "Get Assigned Books" for the full list.
  - `recentActivity` holds the latest 6 events. Types: chapter_completed, book_completed, quiz, workbook_exercise, game, video_lesson, lesson_activity.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
