info:
  name: Get Book Progress
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/guardian/learners/{{kid_id}}/books/{{series_id}}"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Book Progress screen for one book (series). Parent/Teacher only. Returns 404 if the book isn't assigned to the learner.

  - `chapters[].status`: completed | in_progress | not_started | not_assigned. A chapter counts as completed when the kid reaches its last page.
  - `exercises.items[].status`: completed | in_progress | not_started | locked | not_assigned. An exercise unlocks once its chapter is read.
  - `stats.activities`: passed chapter quizzes out of 2 (mid + end) per assigned chapter.
  - `activityHistory`: the latest 20 events for this book.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

