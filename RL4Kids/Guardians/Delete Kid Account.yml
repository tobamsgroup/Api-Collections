info:
  name: Delete Account
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{base_url}}/guardian/kid/:kidId"
  body:
    type: json
    data: |-
      {
        "password": "Passme",
        "reason":""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}/guardian/kid/{{kid_id}}"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "password": "Passme",
            "reason":""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
        - name: date
          value: Tue, 29 Apr 2026 10:00:00 GMT
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Kid Account Deleted Successfully.",
            "timestamp": "2026-04-29T10:00:00.000Z",
            "path": "/api/v1/guardian/kid/:kidId",
            "service": "RL4Kids",
            "version": "1.0.0",
          }
  - name: Wrong password
    request:
      url: "{{base_url}}/guardian/kid/:kidId"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "password": "wrongPassword",
            reason:""
          }
    response:
      status: 400
      statusText: BadRequest
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
        - name: date
          value: Tue, 29 Apr 2026 10:00:00 GMT
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "statusCode": 400,
            "timestamp": "2026-04-29T10:00:00.000Z",
            "path": "/api/v1/guardian/kid/:kidId",
            "message": "Password is incorrect",
            "error": "BadRequestException",
            "service": "RL4Kids"
          }
