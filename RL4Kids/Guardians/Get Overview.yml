info:
  name: Get Overview
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/guardian/overview"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Home screen counters (Guardian token: parent or teacher). `totalUniqueStudents` is every kid under the guardian, `totalAssignedStudents` the kids with at least one assigned volume, and `totalCompletedStudents` those whose assigned volumes are all at 100% progress.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Overview
    request:
      url: "{{base_url}}/guardian/overview"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Success",
            "timestamp": "2026-11-02T10:00:00.000Z",
            "path": "/api/v1/guardian/overview",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "totalUniqueStudents": 3,
              "totalAssignedStudents": 2,
              "totalCompletedStudents": 1
            }
          }
