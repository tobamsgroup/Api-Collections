info:
  name: Get Book Volumes
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/guardian/curriculum/{{book_id}}/volumes"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  All volumes (series) of one book, each with how many of the guardian's kids it is assigned to (Guardian token: parent or teacher). The path param is a **book** id (e.g. Think Entrepreneurship); it must be a valid ObjectId or the request fails with 500.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Book volumes
    request:
      url: "{{base_url}}/guardian/curriculum/6836c8a91607a7982ff81bf0/volumes"
      method: GET
