info:
  name: Get Active Volumes
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/guardian/curriculum/active/volumes"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Volumes (series) the guardian has assigned to at least one kid (Guardian token: parent or teacher). `totalVolumes` counts every volume in the catalogue, `assignedVolumes` is the length of `volumeStats`, and `book` is the populated parent book.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Active volumes
    request:
      url: "{{base_url}}/guardian/curriculum/active/volumes"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Success",
            "timestamp": "2026-11-02T10:00:00.000Z",
