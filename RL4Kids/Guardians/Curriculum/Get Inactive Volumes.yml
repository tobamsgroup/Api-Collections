info:
  name: Get Inactive Volumes
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/guardian/curriculum/inactive/volumes"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Volumes (series) the guardian has not assigned to any kid yet (Guardian token: parent or teacher). Returns a plain array; `book` is the populated parent book.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Inactive volumes
    request:
      url: "{{base_url}}/guardian/curriculum/inactive/volumes"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
