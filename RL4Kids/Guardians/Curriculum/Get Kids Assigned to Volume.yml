info:
  name: Get Kids Assigned to Volume
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/guardian/curriculum/{{series_id}}/kids"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Which of the guardian's kids are assigned to one volume (Guardian token: parent or teacher). The route names the param `bookId`, but the service looks it up as a **volume (series) id**, so pass `{{series_id}}`. Returns a one-item array; `assignedKids` holds kid ids.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Kids assigned to volume
    request:
      url: "{{base_url}}/guardian/curriculum/6836c8ad1607a7982ff81c00/kids"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Success",
            "timestamp": "2026-11-02T10:00:00.000Z",
            "path": "/api/v1/guardian/curriculum/6836c8ad1607a7982ff81c00/kids",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": [
              {
                "seriesId": "6836c8ad1607a7982ff81c00",
                "seriesTitle": "The Spark of an Idea",
                "assignedKids": [
                  "68fa61bf5fa8660a37eaa6ee",
                  "68fa62c35fa8660a37eaa6f4"
                ]
              }
            ]
          }
