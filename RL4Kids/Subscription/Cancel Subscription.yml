request:
  auth: inherit
info:
  name: Cancel Subscription
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{base_url}}/subscription/kid/{{kid_id}}"
  body:
    type: json
    data: |-
      {
        "reason": "The subscription is too expensive"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success (with reason)
    request:
      url: "{{base_url}}/subscription/kid/6a1dfcea1f9dff5f43f873c6"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "reason": "The subscription is too expensive"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Subscription cancelled. You will retain access until the end of your billing period.",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/kid/6a1dfcea1f9dff5f43f873c6",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "currentPeriodEnd": "2026-07-03T10:00:00.000Z"
            }
          }
  - name: Success (no reason)
    request:
      url: "{{base_url}}/subscription/kid/6a1dfcea1f9dff5f43f873c6"
      method: DELETE
      body:
        type: json
        data: |-
          {}
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Subscription cancelled. You will retain access until the end of your billing period.",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/kid/6a1dfcea1f9dff5f43f873c6",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "currentPeriodEnd": "2026-07-03T10:00:00.000Z"
            }
          }
  - name: No active subscription for this kid
    request:
      url: "{{base_url}}/subscription/kid/6a1dfcea1f9dff5f43f873c6"
      method: DELETE
      body:
        type: json
        data: |-
          {}
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 400,
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/kid/6a1dfcea1f9dff5f43f873c6",
            "message": "No active Stripe subscription found for this child.",
            "error": "Bad Request",
            "service": "RL4KIDS"
          }
  - name: Kid not found or does not belong to guardian
    request:
      url: "{{base_url}}/subscription/kid/000000000000000000000000"
      method: DELETE
      body:
        type: json
        data: |-
          {}
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 404,
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/kid/000000000000000000000000",
            "message": "Child profile not found or does not belong to this account.",
            "error": "Not Found",
            "service": "RL4KIDS"
          }
