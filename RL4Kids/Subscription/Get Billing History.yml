request:
  auth: inherit
info:
  name: Get Billing History
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/subscription/billing-history"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success — invoices with kid details
    request:
      url: "{{base_url}}/subscription/billing-history"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Billing history fetched",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/billing-history",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": [
              {
                "id": "in_abc123",
                "planName": "Starter",
                "amount": 799,
                "currency": "gbp",
                "status": "Paid",
                "date": "2026-06-03T00:00:00.000Z",
                "receiptUrl": "https://pay.stripe.com/receipts/abc123",
                "pdfUrl": "https://pay.stripe.com/invoice/abc123/pdf",
                "kid": {
                  "kidId": "6a1dfcea1f9dff5f43f873c6",
                  "name": "Milo Meelo",
                  "username": "meelo",
                  "picture": ""
                }
              },
              {
                "id": "in_def456",
                "planName": "Explorer",
                "amount": 1399,
                "currency": "gbp",
                "status": "Paid",
                "date": "2026-05-03T00:00:00.000Z",
                "receiptUrl": "https://pay.stripe.com/receipts/def456",
                "pdfUrl": "https://pay.stripe.com/invoice/def456/pdf",
                "kid": {
                  "kidId": "6a1eb7c04850b3d405268314",
                  "name": "Ikki Aang",
                  "username": "ikki",
                  "picture": ""
                }
              }
            ]
          }
  - name: Success — no billing history (never subscribed)
    request:
      url: "{{base_url}}/subscription/billing-history"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Billing history fetched",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/billing-history",
