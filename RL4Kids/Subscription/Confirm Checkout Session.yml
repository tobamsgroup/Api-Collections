request:
  auth: inherit
info:
  name: Confirm Checkout Session
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/subscription/confirm?session_id={{stripe_session_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}/subscription/confirm?session_id=cs_test_abc123"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Subscription confirmed",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/confirm",
            "service": "RL4KIDS",
            "version": "1.0.0"
          }
  - name: Session not complete yet
    request:
      url: "{{base_url}}/subscription/confirm?session_id=cs_test_pending"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Subscription confirmed",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/confirm",
            "service": "RL4KIDS",
            "version": "1.0.0"
          }
