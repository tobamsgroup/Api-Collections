request:
  auth: inherit
info:
  name: Get My Subscription
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/subscription/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success — guardian with Stripe customer
    request:
      url: "{{base_url}}/subscription/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Billing info fetched",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/me",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "stripeCustomerId": "cus_Ud318VQtX70RT9",
              "noOfAllowedChildren": 5
            }
          }
  - name: Success — guardian without Stripe customer (never subscribed)
    request:
      url: "{{base_url}}/subscription/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Billing info fetched",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/me",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "stripeCustomerId": null,
              "noOfAllowedChildren": 5
            }
          }
