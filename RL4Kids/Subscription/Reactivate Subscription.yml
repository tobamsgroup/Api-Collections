request:
  auth: inherit
info:
  name: Reactivate Subscription
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/subscription/kid/{{kid_id}}/reactivate"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}/subscription/kid/6a1dfcea1f9dff5f43f873c6/reactivate"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Subscription reactivated. Your plan will continue as normal.",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/kid/6a1dfcea1f9dff5f43f873c6/reactivate",
            "service": "RL4KIDS",
            "version": "1.0.0"
          }
  - name: No active subscription for this kid
    request:
      url: "{{base_url}}/subscription/kid/6a1dfcea1f9dff5f43f873c6/reactivate"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 400,
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/kid/6a1dfcea1f9dff5f43f873c6/reactivate",
            "message": "No active Stripe subscription found for this child.",
            "error": "Bad Request",
            "service": "RL4KIDS"
          }
  - name: Kid not found or does not belong to guardian
    request:
      url: "{{base_url}}/subscription/kid/000000000000000000000000/reactivate"
      method: POST
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 404,
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/kid/000000000000000000000000/reactivate",
            "message": "Child profile not found or does not belong to this account.",
            "error": "Not Found",
            "service": "RL4KIDS"
          }
