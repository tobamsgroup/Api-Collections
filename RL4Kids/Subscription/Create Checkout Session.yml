request:
  auth: inherit
info:
  name: Create Checkout Session
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/subscription/checkout"
  body:
    type: json
    data: |-
      {
        "kidId": "{{kid_id}}",
        "planId": "starter"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: New subscription (returns checkout URL)
    request:
      url: "{{base_url}}/subscription/checkout"
      method: POST
      body:
        type: json
        data: |-
          {
            "kidId": "6a1dfcea1f9dff5f43f873c6",
            "planId": "starter"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 201,
            "message": "Checkout session created",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/checkout",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "url": "https://checkout.stripe.com/pay/cs_test_abc123"
            }
          }
  - name: Existing subscription (plan changed directly, no checkout needed)
    request:
      url: "{{base_url}}/subscription/checkout"
      method: POST
      body:
        type: json
        data: |-
          {
            "kidId": "6a1dfcea1f9dff5f43f873c6",
            "planId": "explorer"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 201,
            "message": "Checkout session created",
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/checkout",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "upgraded": true
            }
          }
  - name: Kid not found or does not belong to guardian
    request:
      url: "{{base_url}}/subscription/checkout"
      method: POST
      body:
        type: json
        data: |-
          {
            "kidId": "000000000000000000000000",
            "planId": "starter"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 404,
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/checkout",
            "message": "Child profile not found or does not belong to this account.",
            "error": "Not Found",
            "service": "RL4KIDS"
          }
  - name: Invalid plan ID
    request:
      url: "{{base_url}}/subscription/checkout"
      method: POST
      body:
        type: json
        data: |-
          {
            "kidId": "6a1dfcea1f9dff5f43f873c6",
            "planId": "invalid_plan"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "statusCode": 400,
            "timestamp": "2026-06-03T10:00:00.000Z",
            "path": "/api/v1/subscription/checkout",
            "message": ["planId must be a valid enum value"],
            "error": "Bad Request",
            "service": "RL4KIDS"
          }
