info:
  name: Get Kids Subscriptions
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/subscription/kids"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

