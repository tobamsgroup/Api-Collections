info:
  name: Get Kids Courses by Series (Guardian)
  type: http
  seq: 17

http:
  method: GET
  url: "{{base_url}}/kid/course/series/{{series_id}}"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Course records of the logged-in guardian's kids that have this series assigned (Guardian token: parent or teacher). Same shape as GET /kid/courses (`kidId` and `bookId` populated); returns an empty array when no kid has the series.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Kids with this series
    request:
      url: "{{base_url}}/kid/course/series/6836c8b01607a7982ff81b02"
      method: GET
