info:
  name: Get Kids Courses (Guardian)
  type: http
  seq: 16

http:
  method: GET
  url: "{{base_url}}/kid/courses"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  All course records (one per kid per book) for every kid under the logged-in guardian (Guardian token: parent or teacher). Results are filtered by the token's user id as `guardianId`, so a Kid token returns an empty array. `kidId` and `bookId` are populated.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Guardian's kids courses
    request:
      url: "{{base_url}}/kid/courses"
      method: GET
    response:
      status: 200
      statusText: OK
