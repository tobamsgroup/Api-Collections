info:
  name: Update Reading Settings
  type: http
  seq: 22

http:
  method: PATCH
  url: "{{base_url}}/kid/me/reading-settings"
  body:
    type: json
    data: |-
      {
        "voice": "young-female-uk"
      }
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Sets the narration voice for Read mode (Kid token only). Returns the updated kid profile (without password). Page audio from GET /tts/:id/audio is generated and cached per voice.

  - `voice` (required): one of `adult-female-us`, `adult-male-us`, `adult-female-uk`, `adult-male-uk`, `adult-female-au`, `adult-male-au`, `adult-female-in`, `adult-male-in`, `young-female-us`, `young-male-us`, `young-female-uk`, `young-male-uk`, `young-female-au`, `young-male-au`, `young-female-in`, `young-male-in`

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Voice updated
    request:
      url: "{{base_url}}/kid/me/reading-settings"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "voice": "young-female-uk"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
