info:
  name: Get Me
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/kid/me"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Current kid's profile (Kid token). Also returns `guardianSubscription`.

  Includes:
  - `assignedBooks`: one entry per assigned Book (category, e.g. Think AI). `accessType` "full" = series assigned (counts towards the plan's booksAllowed), "chapter" = individual chapters only (free plan).
  - `assignmentEligibility`: whether more content can be assigned, using the same rules as POST /kid/course/assign. Check `canAssign` and show `reason` when it is false. `chaptersAllowed`/`chaptersRemaining` are null when unlimited (paid plans).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Current kid profile
    request:
      url: "{{base_url}}/kid/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
                "statusCode": 200,
