info:
  name: Get All Badges with Earned Status
  type: http
  seq: 26

http:
  method: GET
  url: "{{base_url}}/kid/badges-with-earned/all"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Every badge in the system, each flagged with `earned` for the logged-in kid. Use a Kid token: parent/teacher tokens pass the role check, but the token's user id is looked up as a kid, so they get 404 "Kid not found".

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Badges with earned flag
    request:
      url: "{{base_url}}/kid/badges-with-earned/all"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "All badges with earned status fetched successfully",
            "timestamp": "2026-10-19T10:00:00.000Z",
            "path": "/api/v1/kid/badges-with-earned/all",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": [
