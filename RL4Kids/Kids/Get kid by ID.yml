info:
  name: Get kid by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/kid/{{kid_id}}"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Fetch a kid's profile by ID.

  Includes:
  - `assignedBooks`: one entry per assigned Book (category, e.g. Think AI). `accessType` "full" = series assigned (counts towards the plan's booksAllowed), "chapter" = individual chapters only (free plan).
  - `assignmentEligibility`: whether more content can be assigned, using the same rules as POST /kid/course/assign. Check `canAssign` and show `reason` when it is false. `chaptersAllowed`/`chaptersRemaining` are null when unlimited (paid plans).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Kid profile with assigned books and eligibility (free plan)
    request:
      url: "{{base_url}}/kid/6acc6121a57282c78ac098ad"
      method: GET
