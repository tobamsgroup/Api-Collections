info:
  name: Get Learning Overview
  type: http
  seq: 18

http:
  method: GET
  url: "{{base_url}}/kid/{{kid_id}}/learning-overview"
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  A kid's profile summary, this-week stats, assigned series with progress and their recent activities (first 10). Used by the guardian Learning Overview screens; any logged-in role is accepted and there is no check that the kid belongs to the caller.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
