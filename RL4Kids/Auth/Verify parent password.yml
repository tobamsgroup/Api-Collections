info:
  name: Verify parent password
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/auth/verify-parent-password"
  body:
    type: json
    data: |-
      {
        "password": "Passme"
      }
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Parental gate (Apple Kids Category): checks the guardian's account password without issuing new tokens. Works with a Guardian (parent/teacher) or a Kid token; with a Kid token the password is checked against that kid's guardian.

  - `password`: the guardian's account password (required, non-empty string)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Password verified
    request:
      url: "{{base_url}}/auth/verify-parent-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "password": "Passme"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Password verified successfully",
            "timestamp": "2026-11-02T10:00:00.000Z",
            "path": "/api/v1/auth/verify-parent-password",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "data": {
              "verified": true
            }
          }
  - name: Wrong password
    request:
      url: "{{base_url}}/auth/verify-parent-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "password": "wrong-password"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 401,
            "timestamp": "2026-11-02T10:00:00.000Z",
            "path": "/api/v1/auth/verify-parent-password",
            "message": "Incorrect password",
            "error": "UnauthorizedException",
            "service": "RL4KIDS"
          }
