info:
  name: Kid forgot password
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/forgot-password/kid"
  body:
    type: json
    data: |-
      {
        "username": "abdubilal-olareign"
      }
  auth: inherit

docs: |-
  Starts a kid password reset (no token needed). It doesn't send an OTP to the kid: it emails the kid's guardian a reset link (`/forgot-password?type=kid&token=...&username=...`); finish with "Reset child password". Returns 404 if the username doesn't exist.

  - `username`: the kid's username (not validated by a DTO, sent as-is)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Reset link sent to guardian
    request:
      url: "{{base_url}}/auth/forgot-password/kid"
      method: POST
      body:
        type: json
        data: |-
          {
            "username": "abdubilal-olareign"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Password reset OTP sent successfully",
            "timestamp": "2026-11-02T10:00:00.000Z",
            "path": "/api/v1/auth/forgot-password/kid",
            "service": "RL4KIDS",
            "version": "1.0.0"
          }
  - name: Username not found
    request:
      url: "{{base_url}}/auth/forgot-password/kid"
      method: POST
      body:
        type: json
        data: |-
          {
            "username": "nobody-here"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 404,
            "timestamp": "2026-11-02T10:00:00.000Z",
            "path": "/api/v1/auth/forgot-password/kid",
            "message": "Child's username not found",
            "error": "NotFoundException",
            "service": "RL4KIDS"
          }
