info:
  name: Attach User to Push Token
  type: http
  seq: 5

http:
  method: PUT
  url: "{{base_url}}/push-tokens/attach-user"
  body:
    type: json
    data: |-
      {
        "deviceId": "6F1C2A9E-3B4D-4E5F-8A7B-9C0D1E2F3A4B"
      }
  auth:
    type: bearer
    token: "{{access}}"

docs: |-
  Links the device's saved push token to the signed-in user, called right after login. Any role's token works (Guardian or Kid). Returns 400 if no token was registered for that `deviceId`. Like "Register Push Token", the Mongoose document is spread into the envelope under `_doc`.

  - `deviceId`: the same device id sent to "Register Push Token" (required)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: User attached
    request:
      url: "{{base_url}}/push-tokens/attach-user"
      method: PUT
      body:
        type: json
        data: |-
          {
            "deviceId": "6F1C2A9E-3B4D-4E5F-8A7B-9C0D1E2F3A4B"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 200,
            "message": "Success",
            "timestamp": "2026-11-02T10:00:05.000Z",
            "path": "/api/v1/push-tokens/attach-user",
            "service": "RL4KIDS",
            "version": "1.0.0",
            "$__": {
              "activePaths": {
                "paths": {},
                "states": {
                  "init": {}
                }
              },
              "skipId": true
            },
            "$isNew": false,
            "_doc": {
              "_id": "6905f1a2c4e8b91d2a7f3c10",
              "token": "ExponentPushToken[xXyZ123AbCdEfGhIjKlMn]",
              "deviceId": "6F1C2A9E-3B4D-4E5F-8A7B-9C0D1E2F3A4B",
              "deviceType": "ios",
              "isActive": true,
              "lastUsedAt": "2026-11-02T10:00:00.000Z",
              "status": "active",
              "createdAt": "2026-11-02T10:00:00.000Z",
              "updatedAt": "2026-11-02T10:00:05.000Z",
              "__v": 0,
              "userId": "68fa60b45fa8660a37eaa6e1"
            }
          }
  - name: Device not registered
    request:
      url: "{{base_url}}/push-tokens/attach-user"
      method: PUT
      body:
        type: json
        data: |-
          {
            "deviceId": "unknown-device"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "statusCode": 400,
            "timestamp": "2026-11-02T10:00:05.000Z",
            "path": "/api/v1/push-tokens/attach-user",
            "message": "Push token not found for the given device",
            "error": "BadRequestException",
            "service": "RL4KIDS"
          }
