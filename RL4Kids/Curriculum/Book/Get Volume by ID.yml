info:
  name: Get Volume by ID
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/book/series/{{series_id}}"
  auth: inherit

docs: |-
  One volume (series) with its parent book and full chapters (including pages) populated. Used by the Assign Child screen. No auth guard on this controller, so any or no token works. An invalid id fails with 500; an unknown valid id returns `data: null`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Volume
    request:
      url: "{{base_url}}/book/series/6836c8ad1607a7982ff81c00"
      method: GET
