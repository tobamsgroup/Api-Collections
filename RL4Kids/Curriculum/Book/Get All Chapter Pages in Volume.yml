info:
  name: Get All Chapter Pages in Volume
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/book/{{series_id}}/chapter-pages"
  auth: inherit

docs: |-
  Every chapter of a volume (series) with its pages sorted by `index`, used by the kid reader to load a whole volume at once. No auth guard on this controller. Returns 404 if the volume doesn't exist.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Chapter pages
    request:
      url: "{{base_url}}/book/6836c8ad1607a7982ff81c00/chapter-pages"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
