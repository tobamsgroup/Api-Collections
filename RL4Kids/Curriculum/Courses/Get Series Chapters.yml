info:
  name: Get Series Chapters
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/series/{{series_id}}/chapters"
  auth: inherit

docs: |-
  A volume (series) with its parent book and chapters (lessons populated). Used by the guardian Series Overview and kid Playground screens. No auth guard on this controller. Unlike most endpoints the series fields sit at the top level of the response, not under `data` (the app reads `chapters` directly). Returns 404 if the series doesn't exist.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

