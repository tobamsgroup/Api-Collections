info:
  name: Create webinar post
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE}}/webinars"
  body:
    type: json
    data: |-
      {
        "title": "Preparing Nigeria's Next Generation to Win in an AI-Powered World",
        "description": "Discover the skills, opportunities and practical actions young Nigerians need to learn, work, innovate and lead confidently in an AI-powered future.",
        "date": "2026-09-18T00:00:00.000Z",
        "time": "4:00 - 6:00PM WAT",
        "mode": "Virtual",
        "duration": "2 hours",
        "price": 0,
        "registrationLink": "",
        "heroImage": "https://dev-talent-form-test.s3.eu-north-1.amazonaws.com/uploads/1784655145103_webinar-image.png.jpeg",
        "sponsors": [
          { "name": "Tobams Group x Access Bank", "logo": "https://dev-talent-form-test.s3.eu-north-1.amazonaws.com/uploads/1784654958367_sponsor.jpeg" }
        ],
        "about": {
          "header": "Prepare Yourself for an AI-Powered Future",
          "description": "Artificial Intelligence is changing how people learn, work, build businesses and solve everyday problems. To compete and create meaningful impact, Nigeria's next generation needs more than awareness of AI; they need the right skills, mindset and practical understanding to use it responsibly. This Access Bank x Tobams Group webinar brings together industry leaders, innovators and emerging talent to explore how young Nigerians can prepare for new career",
          "image": "https://dev-talent-form-test.s3.eu-north-1.amazonaws.com/uploads/1784655192086_webinar-image2.jpeg"
        },
        "whatYouWillLearn": {
          "header": "Build the Skills and Confidence to Thrive with AI",
          "description": "Get practical insights to help you understand AI, recognise new opportunities and make informed decisions about your career, learning or business.",
          "learningPoints": [
      "Understand how AI is reshaping careers, industries and business opportunities.",
      "Identify the skills needed to remain relevant in an AI-powered economy.",
      "Explore practical ways to use AI for learning, productivity and innovation."
          ]
        },
        "keyTopics": [
          "Skills required in an AI-powered economy",
          "AI and the future of work in Nigeria",
          "AI for career and workforce readiness",
          "Practical AI tools for learning and productivity",
          "Building useful AI-powered solutions",
          "Innovation and entrepreneurship with AI",
          "Responsible and ethical use of AI",
          "Opportunities for students and early-career professionals"
        ],
        "whoShouldAttend": [
          "Business professionals",
          "AI enthusiasts",
          "Educators and researchers",
          "Entrepreneurs and startup founders",
          "Developers and technology professionals",
          "Early-career professionals",
          "NYSC members",
          "Students and recent graduates"
        ],
        "speaker": "",
        "category": "AI & Technology",
        "status": "upcoming",
        "applicationCount": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

