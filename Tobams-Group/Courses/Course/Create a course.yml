info:
  name: Create a course
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE}}/courses"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Test course
      - name: description
        type: text
        value: This is a good start
        description: Optional course description
      - name: category
        type: text
        value: Personal Development2
      - name: price
        type: text
        value: Free
        description: Optional course price
      - name: status
        type: text
        value: Published
        description: Optional course status (Draft, Published, Archived)
      - name: image
        type: file
        value:
          - /Users/fawazabdganiyu/Downloads/Image_20260908_090843_001.png
        contentType: image/png
        description: Optional course image
      - name: courseUrl
        type: text
        value: test-course
        description: courseUrl course URL
  auth:
    type: bearer
    token: "{{admin_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

