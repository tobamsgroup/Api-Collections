info:
  name: Create Project Area
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE}}/experiential-learning/project-areas"
  body:
    type: json
    data: |-
      {
        "name": "Climate Tech",
        "tagline": "Explore How Climate Technology Is Reshaping Industries",
        "description": "Work on real-world climate technology challenges with host organisations.",
        "experience": [
          {
            "label": "3 Weeks",
            "detail": "Structured real-world experience."
          }
        ],
        "whatYouWillDo": [
          "Research carbon markets",
          "Present recommendations"
        ],
        "skillsYouWillBuild": [
          "Research",
          "Sustainability Awareness"
        ],
        "note": "Opportunities are subject to availability."
      }
  auth:
    type: bearer

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
