                        "Exceptional leadership, communication, and stakeholder management skills.",
                        "Entrepreneurial mindset, capable of working across strategy, technology, and business development."
                      ]
                    },
                    {
                      "Preferred Qualifications": [
                        "Master's or PhD in Computer Science, AI, Data Science, or Educational Technology.",
                        "Experience leading technology in rapid-growth startups or innovation-driven global organizations.",
                        "Proven ability to manage multi-country engineering and product teams.",
                        "Prior involvement in AI-EdTech or adaptive learning product development is highly desirable."
