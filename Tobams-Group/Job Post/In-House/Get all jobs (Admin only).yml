                      "Required Experience & Skills": [
                        "10+ years of experience in technology leadership roles, preferably in EdTech, AI, SaaS, or platform-based businesses.",
                        "Proven record of building and scaling AI-driven learning or data platforms from concept to global deployment.",
                        "Deep expertise in machine learning, natural language processing, and adaptive systems.",
                        "Strong technical skills in Python, Node.js, React, cloud services (AWS/GCP/Azure), and data pipeline architecture.",
                        "Experience integrating LMS/LXP technologies, APIs, and analytics frameworks (xAPI, SCORM, or LTI).",
