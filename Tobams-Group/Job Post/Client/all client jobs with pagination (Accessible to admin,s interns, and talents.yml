info:
  name: all client jobs with pagination (Accessible to admin,s interns, and talents
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE}}/job_client?/page=1&limit=10"
  params:
    - name: /page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{org_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Client Restricted
    request:
      url: "{{BASE}}/job_client?/page=1&limit=10"
      method: GET
      params:
        - name: /page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: vary
          value: Origin
        - name: access-control-allow-credentials
          value: "true"
        - name: content-security-policy
