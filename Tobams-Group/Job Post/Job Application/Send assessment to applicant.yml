info:
  name: Send assessment to applicant
  type: http
  seq: 11

http:
  method: POST
  url: "{{BASE}}/job-apply/67d95f590b44aad1ccf50a4e/assessment"
  body:
    type: multipart-form
    data:
      - name: details
        type: text
        value: |-
          Build a small React page that lists jobs from a public API, with search and pagination.
          Submit a GitHub link within 3 days.
      - name: attachments
        type: file
        value:
          - /path/to/assessment-brief.pdf
        contentType: application/pdf
  auth:
    type: bearer
    token: "{{client_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Sent with attachment
    request:
      url: "{{BASE}}/job-apply/67d95f590b44aad1ccf50a4e/assessment"
      method: POST
      body:
        type: multipart-form
        data:
          - name: details
            type: text
            value: |-
              Build a small React page that lists jobs from a public API, with search and pagination.
              Submit a GitHub link within 3 days.
          - name: attachments
            type: file
            value:
              - /path/to/assessment-brief.pdf
            contentType: application/pdf
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Assessment sent to candidate successfully",
            "data": {
              "_id": "67d95f590b44aad1ccf50a4e",
              "fullName": "Ada Lovelace",
              "phoneNumber": "+2348012345678",
              "email": "ada@example.com",
              "country": "Nigeria",
              "bio": "Frontend engineer with three years of experience.",
              "portfolioLink": "https://portfolio.example.com/ada",
              "resume": "https://cdn.example.com/ada-cv.pdf",
              "postId": "67d95578b3ea8eee43ef5ce4",
              "jobTitle": "Software Engineer",
              "stage": "Assessment",
              "applicantRole": "Talent",
              "organisationId": "67bf2c6a974a6b52304105a0",
              "userId": "67b661d7c84dd7079b9e7d56",
              "assessmentDetails": "Build a small React page that lists jobs from a public API, with search and pagination.\nSubmit a GitHub link within 3 days.",
