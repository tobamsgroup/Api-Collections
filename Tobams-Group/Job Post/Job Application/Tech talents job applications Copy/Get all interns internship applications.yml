info:
  name: Get all interns internship applications
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE}}/job-apply/tech-talents?role=intern"
  params:
    - name: role
      value: intern
      type: query
      description: "Optional. Talent|Intern. Any case"
    - name: dateFilter
      value: "3 days ago"
      type: query
      description: "Optional. 'last 24 hours'|'3 days ago'|'1 week ago'|'1 month ago'|'custom'. Any case"
      disabled: true
    - name: search
      value: "developer"
      type: query
      description: "Optional. 1 to 500 characters"
      disabled: true
    - name: sortPreset
      value: "last_month"
      type: query
      description: "Optional. most_recent|seven_days_ago|this_month|last_month. Default most_recent"
      disabled: true
    - name: page
      value: "1"
      type: query
      description: "Optional. Default 1"
      disabled: true
    - name: limit
      value: "8"
      type: query
      description: "Optional. Default 10, max 100"
      disabled: true
    - name: stage
      value: ""
      type: query
      description: "Optional. Applied|Shortlisted|Assessment|Interview|Hired|Rejected. Any case"
      disabled: true
    - name: clientId
      value: ""
      type: query
      description: "Optional. 24-hex id of an organisation. Ignored for an organisation, which only sees its own"
      disabled: true
    - name: from
      value: "2026-08-01"
      type: query
      description: "YYYY-MM-DD. Only with dateFilter=custom, where it is required"
      disabled: true
    - name: to
      value: "2026-09-01"
      type: query
      description: "YYYY-MM-DD. Only with dateFilter=custom, where it is required. Not before from"
      disabled: true
    - name: workMode
      value: "remote"
      type: query
      description: "Optional. onsite|remote. Any case; on-site is accepted. Hybrid matches neither"
      disabled: true
    - name: location
      value: "lagos"
      type: query
      description: "Optional. Free text, up to 100 characters. Commas split terms and every term must match"
      disabled: true
    - name: experienceLevel
      value: "mid"
      type: query
      description: "Optional. any|entry|mid|senior. Any case. entry 0-1 years or none recorded, mid 2-5, senior 6+"
      disabled: true
    - name: employmentType
      value: "full-time"
      type: query
      description: "Optional. full-time|part-time|temporary. Repeat it or use commas; any selected matches. temporary means Contract, Freelance or Temporary"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

