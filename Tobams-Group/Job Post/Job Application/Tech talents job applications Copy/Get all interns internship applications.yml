docs: |-
  **Inputs ignore case and surrounding spaces:** `stage`, `role`, `dateFilter`, `sortPreset`. `stage=Interviewed` is still accepted and means `Interview`. Unknown values are a 400.

  **Rows** include `rejectedAtStage`: the stage a rejected applicant had reached, `null` otherwise and on rows rejected before the field existed.

  **`stageCounts`** feeds the tabs. It ignores the `stage` filter and respects the other filters.

  **Candidate filters (all optional):** `workMode`, `location`, `experienceLevel`, `employmentType`. They read the applicant's profile and work alongside the other filters.

  **Filter panel to query param:**

  | Panel | Param | Values | Matches |
  | --- | --- | --- | --- |
  | Location: Onsite / Remote | `workMode` | `onsite`, `remote` | The candidate's preferred work mode (`jobPreferences.workMode`, `internshipPreferences.workMode`). Hybrid matches neither |
  | Location: Exact location | `location` | free text | Every comma-separated term in the account's city, state or country, or the preferred location |
  | Date of posting | `dateFilter` | `last 24 hours`, `3 days ago`, `1 week ago`, `1 month ago`, `custom`; omit for All time | The date of the application. `custom` needs `from` and `to` |
  | Work experience | `experienceLevel` | `any`, `entry`, `mid`, `senior` | Stored `yearsOfExperience`: entry 0-1 years or none recorded, mid 2-5, senior 6+ |
  | Type of employment | `employmentType` | `full-time`, `part-time`, `temporary` | Any selected, on the preferred `workType` (interns also `internshipType`). `temporary` means Contract, Freelance or Temporary |

  **Rules:** blank means no filter. An unknown value is a 400. `from` or `to` without `dateFilter=custom` is a 400. `search` here keeps its own fields (name, email, job title and so on), not the profile fields above.

  **Guest applications** have no profile, so the profile filters exclude them. `location` still matches their own `location` and `country`.

  **`stageCounts`** follows these filters too.
