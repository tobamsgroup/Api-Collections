info:
  name: job by ID
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{BASE}}/job-apply/65e616b42acf83a9a2608d31"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{BASE}}/job-apply/65e616b42acf83a9a2608d31"
      method: DELETE
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Job Application Deleted"
          }
  - name: Malformed id
    description: "Current behaviour: success is true on this 400"
    request:
      url: "{{BASE}}/job-apply/not-an-id"
      method: DELETE
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Invalid job ID format"
          }
  - name: Not found
    description: "Current behaviour: an unknown id is a 500, not a 404"
    request:
      url: "{{BASE}}/job-apply/65e616b42acf83a9a2608d31"
      method: DELETE
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "Error",
            "message": "Job not foundC"
          }
  - name: Not allowed
    request:
      url: "{{BASE}}/job-apply/65e616b42acf83a9a2608d31"
      method: DELETE
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "AuthorizationError",
            "message": "Restricted Action, Unauthorized Access❗"
          }

docs: |-
  **Who:** `Super_Admin`, or `Admin` with `SUPER` or `USER MANAGEMENT`.

  **Known issues in the current code:** a malformed id answers 400 with `success: true`, and an unknown id is a 500 rather than a 404.
