info:
  name: job by ID
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{BASE}}/job-apply/65e616b42acf83a9a2608d31"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{BASE}}/job-apply/65e616b42acf83a9a2608d31"
      method: DELETE
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Job Application Deleted"
          }
  - name: Malformed id
    request:
      url: "{{BASE}}/job-apply/not-an-id"
      method: DELETE
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "ValidationError",
            "message": "jobID: Invalid application ID format"
          }
  - name: Not found
    request:
      url: "{{BASE}}/job-apply/65e616b42acf83a9a2608d31"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "NotFoundError",
            "message": "Job application not found"
          }
  - name: Not allowed
    request:
      url: "{{BASE}}/job-apply/65e616b42acf83a9a2608d31"
      method: DELETE
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "AuthorizationError",
            "message": "Restricted Action, Unauthorized Access❗"
          }

docs: |-
  Deletes one job application. The id in the path is the application's id.

  **Who:** `Super_Admin`, or `Admin` with `SUPER` or `USER MANAGEMENT`. Anyone else is a 403.

  **Errors:** a malformed id is a 400, and an unknown or already deleted id is a 404.
