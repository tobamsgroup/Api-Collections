info:
  name: Bulk Update Job Application Stage
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{BASE}}/job-apply/stages/bulk"
  body:
    type: json
    data: |-
      {
        "applicationIds": [
          "67d95f590b44aad1ccf50a4e",
          "67d95f590b44aad1ccf50a4f"
        ], // required. 1 to 100 distinct ids
        "stage": "Shortlisted" // required. Shortlisted | Assessment | Interview | Hired | Rejected. Any case
      }
  auth:
    type: bearer
    token: "{{client_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Bulk Update Stage
    request:
      url: "{{BASE}}/job-apply/stages/bulk"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "applicationIds": [
              "67d95f590b44aad1ccf50a4e",
              "67d95f590b44aad1ccf50a4f"
            ], // required. 1 to 100 distinct ids
            "stage": "Shortlisted" // required. Shortlisted | Assessment | Interview | Hired | Rejected. Any case
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "2 applicant stage(s) updated to Shortlisted",
            "data": {
              "stage": "Shortlisted",
              "matchedCount": 2,
              "modifiedCount": 2,
              "updatedApplicationIds": [
                "67d95f590b44aad1ccf50a4e",
                "67d95f590b44aad1ccf50a4f"
              ],
              "unchangedApplicationIds": [],
              "conflictedApplicationIds": []
            }
          }

  - name: Refused move
    description: One refused move refuses the whole batch. Each refused id is listed with its reason
    request:
      url: "{{BASE}}/job-apply/stages/bulk"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "applicationIds": ["67d95f590b44aad1ccf50a4e", "67d95f590b44aad1ccf50a4f"],
            "stage": "Hired"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "BadRequestError",
            "message": "Stage update not allowed. 67d95f590b44aad1ccf50a4e: Applicant must be interviewed before hiring; 67d95f590b44aad1ccf50a4f: Applicant has already been rejected"
          }
  - name: Invalid stage
    request:
      url: "{{BASE}}/job-apply/stages/bulk"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "applicationIds": ["67d95f590b44aad1ccf50a4e"],
            "stage": "Applied"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "ValidationError",
            "message": "stage: stage must be one of: Shortlisted, Assessment, Interview, Hired, Rejected"
          }
  - name: Duplicate ids
    description: Ids are compared case-insensitively, so the same id in upper and lower case is also a duplicate
    request:
      url: "{{BASE}}/job-apply/stages/bulk"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "applicationIds": ["67d95f590b44aad1ccf50a4e", "67D95F590B44AAD1CCF50A4E"],
            "stage": "Shortlisted"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "ValidationError",
            "message": "applicationIds: Application IDs must be unique"
          }
  - name: Not found or another organisation's application
    description: Any id that is missing, or not on the organisation's own posts, fails the whole batch
    request:
      url: "{{BASE}}/job-apply/stages/bulk"
      method: PATCH
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "NotFoundError",
            "message": "One or more job applications were not found"
          }
  - name: Role not allowed
    request:
      url: "{{BASE}}/job-apply/stages/bulk"
      method: PATCH
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "AuthorizationError",
            "message": "Restricted Action, Unauthorized Access❗"
          }

docs: |-
  **Forward only:** `Applied` > `Shortlisted` > `Assessment` > `Interview` > `Hired`.

  - Skipping forward is allowed, except `Hired` needs `Interview`.
  - `Rejected` is reachable from anything except `Hired`, and is final.
  - Failing an assessment or interview moves nobody. They stay where they are until rejected.
  - A refused move is a 400. `Applied` is never a target.

  `ADMIN` and `SUPER_ADMIN` may move backward or undo a rejection to correct mistakes, but can't move anyone out of `Hired` or into it from before `Interview`.

  `stage` ignores case and surrounding spaces. `Interviewed` is accepted and means `Interview`.

  One refused move refuses the whole batch and nothing is written. 1 to 100 distinct `applicationIds`. Ids are compared case-insensitively, so `67d9...` and `67D9...` count as the same id and the request is a 400 "Application IDs must be unique".
