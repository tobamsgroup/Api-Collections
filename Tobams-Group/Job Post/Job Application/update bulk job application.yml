info:
  name: Bulk Update Job Application Stage
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{BASE}}/job-apply/stages/bulk"
  body:
    type: json
    data: |-
      {
        "applicationIds": [
          "67d95f590b44aad1ccf50a4e",
          "67d95f590b44aad1ccf50a4f"
        ],
        "stage": "Shortlisted"
      }
  auth:
    type: bearer
    token: "{{client_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Bulk Update Stage
    request:
      url: "{{BASE}}/job-apply/stages/bulk"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "applicationIds": [
              "67d95f590b44aad1ccf50a4e",
              "67d95f590b44aad1ccf50a4f"
            ],
            "stage": "Shortlisted"
          }
    response:
      statusText: "200"
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "2 applicant stages updated successfully",
            "data": {
              "stage": "Shortlisted",
              "matchedCount": 2,
              "modifiedCount": 2,
              "updatedApplicationIds": [
                "67d95f590b44aad1ccf50a4e",
                "67d95f590b44aad1ccf50a4f"
              ],
              "unchangedApplicationIds": [],
              "conflictedApplicationIds": []
              
            }
          }

docs:
  content: |-
    **Forward only:** `Applied` > `Shortlisted` > `Assessment` > `Interview` > `Hired`.

    - Skipping forward is allowed, except `Hired` needs `Interview`.
    - `Rejected` is reachable from anything except `Hired`, and is final.
    - Failing an assessment or interview moves nobody. They stay where they are until rejected.
    - A refused move is a 400. `Applied` is never a target.

    `ADMIN` and `SUPER_ADMIN` may move backward or undo a rejection to correct mistakes, but can't move anyone out of `Hired` or into it from before `Interview`.

    `stage` ignores case and surrounding spaces. `Interviewed` is accepted and means `Interview`.

    One refused move refuses the whole batch and nothing is written. 1 to 100 distinct `applicationIds`.
