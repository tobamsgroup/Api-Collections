settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Update personal info
    request:
      url: "{{BASE}}/mentors"
      method: PATCH
      body:
        type: json
        data: |-
          {
              "firstName": "Fawaz",
              "lastName": "Agara",
              "title": "Software Engineer",
              "yearsOfExperience": "3-5 years",
              "telephone": "+23479656740",
              "linkedInURL": "https://delicious-solutions.info/",
              "linkText": "linkedIn profile"

          }
    response:
      body:
        type: text
        data: ""
  - name: Update bio
    request:
      url: "{{BASE}}/mentors"
      method: PATCH
      body:
        type: json
        data: "{\r

          \    \"bio\": \"Experienced technology mentor with 10+ years in software development\" // Required, max 1000 chars\r

          }"
    response:
      body:
        type: text
        data: ""
  - name: Update areas of expertise
    request:
      url: "{{BASE}}/mentors"
      method: PATCH
      body:
        type: json
        data: "{\r

          \    \"areasOfExpertise\": [\"Web Development\", \"Software Engineering\"]\r

          }"
    response:
      body:
        type: text
        data: ""
  - name: Update mentorship preference
    request:
      url: "{{BASE}}/mentors"
      method: PATCH
      body:
        type: json
        data: "{\r

          \    \"mentorshipType\": [\"Group\", \"One-to-one\"], // e.g \"Group\" or \"One-to-one\" or \"Group, One-to-one\"\r

          \    \"industry\": [\"Engineering\"]\r

          }"
    response:
      body:
        type: text
        data: ""
  - name: Update availability
    request:
      url: "{{BASE}}/mentors"
      method: PATCH
      body:
        type: json
        data: "{\r

          \    \"availability\": [\r

          \        {\r

          \            \"days\": [\"MON\", \"TUE\"],\r

          \            \"times\": [\"10:00 AM\", \"1:00 PM\", \"10:00 PM\"]\r

          \        },\r

          \        // {\r

          \        //     \"days\": [\"WEEKENDS\"],\r

          \        //     \"times\": [\"10:00 AM\", \"1:00 PM\", \"10:00 PM\"]\r

          \        // },\r

          \        {\r

          \            \"days\": [\"MON\", \"TUE\"],\r

          \            \"times\": [\"10:00 AM - 1:00 PM\", \"10:00 PM\"]\r

          \        },\r

          \        {\r

          \            \"days\": [\"MON\", \"TUE\"],\r

          \            \"times\": [\r

          \                \"10:00 AM\",\r

          \                \"1:00 PM\",\r

          \                \"10:00 PM\"\r

          \            ],\r

          \            \"_id\": \"67b84d72ab89ac59aaf73a0f\"\r

          \        },\r

          \        {\r

          \            \"days\": [\r

          \                \"MON\",\r

          \                \"TUE\"\r

          \            ],\r

          \            \"times\": [\r

          \                \"10:00 AM - 1:00 PM\",\r

          \                \"10:00 PM\"\r

          \            ],\r

          \            \"_id\": \"67b84d72ab89ac59aaf73a10\"\r

          \        }\r

          \    ]\r

          }"
    response:
      body:
        type: text
        data: ""

  - name: "Update profile photo only (multipart)"
    request:
      url: "{{BASE}}/mentors"
      method: PATCH
      body:
        type: multipart-form
        data:
          - name: photo
            type: file
            value:
              - /path/to/new-headshot.jpg
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Profile photo updated successfully",
            "data": {
              "_id": "67b84d72ab89ac59aaf73a00",
              "userId": "67b84d72ab89ac59aaf73a01",
              "photo": "https://tobams-group-bucket.s3.eu-west-2.amazonaws.com/profiles/1760000000000_new-headshot.jpg",
              "bio": "Experienced technology mentor with 10+ years in software development",
              "yearsOfExperience": 12,
              "createdAt": "2026-01-10T10:00:00.000Z",
              "updatedAt": "2026-10-22T09:00:00.000Z"
            }
          }
  - name: "Invalid photo type"
    request:
      url: "{{BASE}}/mentors"
      method: PATCH
      body:
        type: multipart-form
        data:
          - name: photo
            type: file
            value:
              - /path/to/document.pdf
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "BadRequestError",
            "message": "Profile photo must be an image (JPEG, PNG, GIF, or WebP)"
          }

docs: |-
  **Profile photo (multipart):** send `multipart/form-data` with a `photo` file field alongside, or instead of, any of the JSON fields below — nested fields (`availability`, etc.) must then be JSON-encoded strings. `attachProfilePhoto` runs before this controller, uploads to S3 (`profiles/` folder, JPEG/PNG/GIF/WebP only, ≤4MB) and deletes the previous photo; a photo-only request returns **200** `Profile photo updated successfully` instead of the usual 400 for an otherwise-empty body. Invalid file: **400** `Profile photo must be an image (JPEG, PNG, GIF, or WebP)` or `Profile photo must not exceed 4MB.`.

  `IndustryTypes { "Technology", "Healthcare", "Finance", "Manufacturing", "Retail", "Energy", "Transportation and Logistics", "Real Estate", "Hospitality and Tourism", "Entertainment and Media",}`

  CompanySizeTypes {

  ZERO_TO_NINE = "0-9", //Micro-Enterprise

  TEN_TO_FORTY_NINE = "10-49", //Small Business

  FIFTY_TO_ONE_HUNDRED_NINETY_NINE = "50-249", //Medium-Sized Business

  TWO_HUNDRED_TO_FIVE_HUNDRED_NINETY_NINE = "250-999", //Large Enterprise

  ABOVE_ONE_THOUSAND = "1000 and above", //Very Large Enterprise

  }
