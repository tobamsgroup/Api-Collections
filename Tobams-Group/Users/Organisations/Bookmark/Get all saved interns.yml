info:
  name: Get all saved interns
  type: http
  seq: 5

http:
  method: GET
  url: "{{BASE}}/organisation/tech-talents/bookmarks?role=intern"
  params:
    - name: role
      value: "intern"
      type: query
      description: "Required. talent|intern. Lowercase"
    - name: workMode
      value: "remote"
      type: query
      description: "Optional. onsite|remote. Any case; on-site is accepted. Hybrid matches neither"
      disabled: true
    - name: location
      value: "lagos"
      type: query
      description: "Optional. Free text, up to 100 characters. Commas split terms and every term must match"
      disabled: true
    - name: experienceLevel
      value: "mid"
      type: query
      description: "Optional. any|entry|mid|senior. Any case. entry 0-1 years or none recorded, mid 2-5, senior 6+"
      disabled: true
    - name: employmentType
      value: "full-time"
      type: query
      description: "Optional. full-time|part-time|temporary. Repeat it or use commas; any selected matches. temporary means Contract, Freelance or Temporary"
      disabled: true
    - name: search
      value: "designer"
      type: query
      description: "Optional. 1 to 200 characters. Whitespace splits terms, at most 6, and every term must match"
      disabled: true
    - name: dateFilter
      value: "1 week ago"
      type: query
      description: "Optional. 'last 24 hours'|'3 days ago'|'1 week ago'|'1 month ago'|'custom'. Any case. Omit for all time. Date the account joined"
      disabled: true
    - name: from
      value: "2026-08-01"
      type: query
      description: "YYYY-MM-DD. Only with dateFilter=custom, where it is required"
      disabled: true
    - name: to
      value: "2026-09-01"
      type: query
      description: "YYYY-MM-DD. Only with dateFilter=custom, where it is required. Not before from"
      disabled: true
  auth:
    type: bearer
    token: "{{client_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Filtered"
    request:
      url: "{{BASE}}/organisation/tech-talents/bookmarks?role=intern&employmentType=part-time"
      method: GET
      params:
        - name: role
          value: "intern"
          type: query
        - name: employmentType
          value: "part-time"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Saved intern retrieved successfully",
            "data": [
              {
                "_id": "6aed993e908dcdffc8b031f0",
                "occupation": "Data Analyst",
                "bio": "Data analyst intern.",
                "firstName": "Cleo",
                "lastName": "Example",
                "email": "candidate3@example.com",
                "telephone": "+2348000000000",
                "location": {
                  "city": "Accra",
                  "country": "Ghana"
                },
                "photo": "",
                "profile": "Intern",
                "accountStatus": "Active",
                "skills": [
                  "SQL",
                  "Excel"
                ],
                "mentorshipType": [],
                "averageRating": 0,
                "createdAt": "2026-11-06T09:09:18.913Z",
                "updatedAt": "2026-11-06T09:09:18.913Z",
                "yearsOfExperience": "0+"
              }
            ]
          }

docs: |-
  **Who can call:** `Super_Admin`, `Admin` (`SUPER` or `USER_MANAGEMENT` privilege), `Organisation`.

  **Required:** `role`, `talent` or `intern`, lowercase. Missing or anything else is a 400. Here it is `intern`.

  **Optional:** every other query param. This list has no `page` or `limit`.

  **Filter panel to query param:**

  | Panel | Param | Values | Matches |
  | --- | --- | --- | --- |
  | Location: Onsite / Remote | `workMode` | `onsite`, `remote` | The candidate's preferred work mode (`jobPreferences.workMode`, `internshipPreferences.workMode`). Hybrid matches neither |
  | Location: Exact location | `location` | free text | Every comma-separated term in the account's city, state or country, or the preferred location |
  | Date of posting | `dateFilter` | `last 24 hours`, `3 days ago`, `1 week ago`, `1 month ago`, `custom`; omit for All time | The date the account joined. `custom` needs `from` and `to` |
  | Search bar | `search` | free text | Every whitespace-separated term in the name, `occupation`, `title`, `skills`, bio, job titles, or preferred `role` |
  | Work experience | `experienceLevel` | `any`, `entry`, `mid`, `senior` | Stored `yearsOfExperience`: entry 0-1 years or none recorded, mid 2-5, senior 6+ |
  | Type of employment | `employmentType` | `full-time`, `part-time`, `temporary` | Any selected, on the preferred `workType` (interns also `internshipType`). `temporary` means Contract, Freelance or Temporary |

  **Rules:** blank means no filter. An unknown value is a 400. `from` or `to` without `dateFilter=custom` is a 400.

  **Response (`data`):** an array of saved candidates. An empty list is a `200` with `[]`, including when nothing matches the filters (it used to be a 400).
