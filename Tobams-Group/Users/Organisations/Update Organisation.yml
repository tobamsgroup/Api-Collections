info:
  name: Update Organisation
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{BASE}}/organisation"
  body:
    type: json
    data: |-
      {
        "companyType": "Consultation Company",
        "companySize": "0-9",
        "industry": "Technology",
        "location": {
          "city": "England",
          "country": "United Kingdom"
        },
        "about": "Tobams Group is a leading provider of digital solutions, focusing on mobile app development, website design, tech talent acquisition, and strategic marketing, aiming to elevate businesses to new heights."
      }
  auth:
    type: bearer
    token: "{{client_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Partial update of the current organisation's profile. `?userId=` lets an admin update another organisation's profile instead of their own (anyone else naming a different `userId` is a 403).

    **Profile photo (multipart, fixed in PR #868):** send `multipart/form-data` with a `photo` file field alongside (or instead of) the JSON fields below — nested objects like `location` must then be JSON-encoded strings, since multipart text fields are always strings. `attachProfilePhoto` runs before this controller: it uploads the file to S3 (`profiles/` folder, JPEG/PNG/GIF/WebP only, ≤4MB), writes the new URL onto the user, and deletes the previous photo object — **before** the controller decides what to respond with. That means a photo-only request (or a photo plus the locked `companyName`) must not 400 after the photo has already changed; see `updatedAt`/photo below.

    - Photo with no other field (or only `companyName`): **200** `Profile photo updated successfully` (plus the company-name notice if `companyName` was also sent). `companyName` is still never written.
    - Photo with at least one other real field: **201**, same as a JSON-only update — the response already reflects the new photo URL, since the middleware persisted it first.
    - Invalid file: **400** `Profile photo must be an image (JPEG, PNG, GIF, or WebP)`, or `Profile photo must not exceed 4MB.`. More than one `photo` file: **400** `Only one profile photo is allowed`.

    **`companyName` is never editable here** — it's set at registration and only an admin can change it directly on the record. Sending it alone (no photo, no other field) is a **400** `BadRequestError` `Company name cannot be edited without admin approval.` (routed through the error middleware, like every other rejection in this handler — an earlier version of this endpoint answered that case with a `success: true` body on a 400 status via `handleResponse`, fixed alongside PR #868). Sending it together with another real field still succeeds, with a notice appended to the success message. An empty request (no body, no photo) is **400** `Payload is required`.

    `IndustryTypes { "Technology", "Healthcare", "Finance", "Manufacturing", "Retail", "Energy", "Transportation and Logistics", "Real Estate", "Hospitality and Tourism", "Entertainment and Media" }`

    `CompanySizeTypes { "0-9" (Micro-Enterprise), "10-49" (Small Business), "50-249" (Medium-Sized Business), "250-999" (Large Enterprise), "1000 and above" (Very Large Enterprise) }`
  type: text/markdown

examples:
  - name: Update company details
    request:
      url: "{{BASE}}/organisation"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "companyType": "Consultation Company",
            "companySize": "0-9",
            "industry": "Technology",
            "location": {
              "city": "England",
              "country": "United Kingdom"
            },
            "about": "Tobams Group is a leading provider of digital solutions, focusing on mobile app development, website design, tech talent acquisition, and strategic marketing, aiming to elevate businesses to new heights."
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "message": "Profile updated successfully",
              "data": {
                  "hiringNeeds": {
                      "coreValues": [],
                      "preferredJobType": []
                  },
                  "openPositionsCount": 0,
                  "candidatesCount": 0,
                  "recentHiresCount": 0,
                  "_id": "67bf2c6a974a6b52304105a1",
                  "userId": "67bf2c6a974a6b52304105a0",
                  "companySize": "0-9",
                  "industry": "Technology",
                  "rating": 0,
                  "reviews": [],
                  "createdAt": "2025-02-26T14:59:54.295Z",
                  "updatedAt": "2025-03-12T22:53:05.222Z",
                  "about": "Tobams Group is a leading provider of digital solutions, focusing on mobile app development, website design, tech talent acquisition, and strategic marketing, aiming to elevate businesses to new heights.",
                  "companyType": "Consultation Company"
              }
          }
  - name: "Update profile photo only (multipart)"
    request:
      url: "{{BASE}}/organisation"
      method: PATCH
      body:
        type: multipart-form
        data:
          - name: photo
            type: file
            value:
              - /path/to/new-logo.png
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "message": "Profile photo updated successfully",
              "data": {
                  "hiringNeeds": {
                      "coreValues": [],
                      "preferredJobType": []
                  },
                  "openPositionsCount": 0,
                  "candidatesCount": 0,
                  "recentHiresCount": 0,
                  "_id": "67bf2c6a974a6b52304105a1",
                  "userId": "67bf2c6a974a6b52304105a0",
                  "companySize": "0-9",
                  "industry": "Technology",
                  "rating": 0,
                  "reviews": [],
                  "photo": "https://tobams-group-bucket.s3.eu-west-2.amazonaws.com/profiles/1760000000000_new-logo.png",
                  "createdAt": "2025-02-26T14:59:54.295Z",
                  "updatedAt": "2026-10-22T09:00:00.000Z",
                  "about": "Tobams Group is a leading provider of digital solutions, focusing on mobile app development, website design, tech talent acquisition, and strategic marketing, aiming to elevate businesses to new heights.",
                  "companyType": "Consultation Company"
              }
          }
  - name: "Photo plus companyName only (PR #868 regression: 200, not 400)"
    request:
      url: "{{BASE}}/organisation"
      method: PATCH
      body:
        type: multipart-form
        data:
          - name: photo
            type: file
            value:
              - /path/to/new-logo.png
          - name: companyName
            type: text
            value: Tech Innovations Inc.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "message": "Profile photo updated successfully. Company name cannot be edited without admin approval.",
              "data": {
                  "hiringNeeds": {
                      "coreValues": [],
                      "preferredJobType": []
                  },
                  "openPositionsCount": 0,
                  "candidatesCount": 0,
                  "recentHiresCount": 0,
                  "_id": "67bf2c6a974a6b52304105a1",
                  "userId": "67bf2c6a974a6b52304105a0",
                  "companySize": "0-9",
                  "industry": "Technology",
                  "rating": 0,
                  "reviews": [],
                  "photo": "https://tobams-group-bucket.s3.eu-west-2.amazonaws.com/profiles/1760000000000_new-logo.png",
                  "createdAt": "2025-02-26T14:59:54.295Z",
                  "updatedAt": "2026-10-22T09:00:00.000Z",
                  "about": "Tobams Group is a leading provider of digital solutions, focusing on mobile app development, website design, tech talent acquisition, and strategic marketing, aiming to elevate businesses to new heights.",
                  "companyType": "Consultation Company"
              }
          }
  - name: "update companyName (no photo, no other field)"
    request:
      url: "{{BASE}}/organisation"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "companyName": "Tech Innovations Inc."
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": false,
              "error": "BadRequestError",
              "message": "Company name cannot be edited without admin approval."
          }
  - name: update companyName with about field
    request:
      url: "{{BASE}}/organisation"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "companyName": "Tech Innovations Inc.",
            "about": "Tobams Group is a leading provider of digital solutions, focusing on mobile app development, aiming to elevate businesses to new heights."
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "message": "Profile updated successfully. Company name cannot be edited without admin approval.",
              "data": {
                  "hiringNeeds": {
                      "coreValues": [],
                      "preferredJobType": []
                  },
                  "openPositionsCount": 0,
                  "candidatesCount": 0,
                  "recentHiresCount": 0,
                  "_id": "67bf2c6a974a6b52304105a1",
                  "userId": "67bf2c6a974a6b52304105a0",
                  "companySize": "0-9",
                  "industry": "Technology",
                  "rating": 0,
                  "reviews": [],
                  "createdAt": "2025-02-26T14:59:54.295Z",
                  "updatedAt": "2025-03-12T23:13:56.740Z",
                  "about": "Tobams Group is a leading provider of digital solutions, focusing on mobile app development, aiming to elevate businesses to new heights.",
                  "companyType": "Consultation Company",
                  "website": "www.tobamsgroup.com"
              }
          }
  - name: "Invalid photo type"
    request:
      url: "{{BASE}}/organisation"
      method: PATCH
      body:
        type: multipart-form
        data:
          - name: photo
            type: file
            value:
              - /path/to/document.pdf
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "BadRequestError",
            "message": "Profile photo must be an image (JPEG, PNG, GIF, or WebP)"
          }
  - name: "Empty request (no fields, no photo)"
    request:
      url: "{{BASE}}/organisation"
      method: PATCH
      body:
        type: json
        data: "{}"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "BadRequestError",
            "message": "Payload is required"
          }
