    data: |-
      {
        "role": "Talent", // Intern, Talent, Mentor, Organisation, Admin, or Super_Admin,
        "firstName": "Jane",
        "lastName": "Doe",
        "email": "user@example.com",
        "telephone": "+2340000000000",
        "password": "Password123!"
