docs: |-
  Partial update of the current intern's profile (JSON), or `multipart/form-data` to also replace the profile photo. `?userId=` lets an admin update another intern's profile instead of their own.

  **Profile photo (multipart):** send a `photo` file field alongside, or instead of, any JSON fields below — nested fields (`personalInfo`, `education`, `workExperience`, etc.) must then be JSON-encoded strings, since multipart text fields are always strings. `attachProfilePhoto` runs before the controller: uploads to S3 (`profiles/` folder, JPEG/PNG/GIF/WebP only, ≤4MB) and deletes the previous photo. A photo-only request returns **200** `Profile photo updated successfully` instead of the usual 400 for an otherwise-empty body. Invalid file: **400** `Profile photo must be an image (JPEG, PNG, GIF, or WebP)` or `Profile photo must not exceed 4MB.`. More than one file: **400** `Only one profile photo is allowed`.

examples:
  - name: "Update profile photo only (multipart)"
    request:
      url: "{{BASE}}/interns"
      method: PATCH
      body:
        type: multipart-form
        data:
          - name: photo
            type: file
            value:
              - /path/to/new-headshot.jpg
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Profile photo updated successfully",
            "data": {
              "_id": "67aa0efe2f8a35e17e38e61e",
              "photo": "https://tobams-group-bucket.s3.eu-west-2.amazonaws.com/profiles/1760000000000_new-headshot.jpg",
              "bio": "Passionate about software development and eager to learn.",
              "createdAt": "2026-01-10T10:00:00.000Z",
              "updatedAt": "2026-10-22T09:00:00.000Z"
            }
          }
  - name: "Invalid photo type"
    request:
      url: "{{BASE}}/interns"
      method: PATCH
      body:
        type: multipart-form
        data:
          - name: photo
            type: file
            value:
              - /path/to/document.pdf
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "BadRequestError",
            "message": "Profile photo must be an image (JPEG, PNG, GIF, or WebP)"
          }
