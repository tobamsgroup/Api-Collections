info:
  name: Reschedule AI webinar reminders
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE}}/secure-seat/reschedule-reminders?key={{DIGEST_KEY}}"
  params:
    - name: key
      value: "{{DIGEST_KEY}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: DIGEST_KEY
      value: EMAIL_DIGEST_KEY

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
