  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "email": "john.doe@example.com",
        "phoneNumber": "+2348012345678",
        "country": "Nigeria",
        "role": "Software Engineer",
        "ageGroup": "25-40",
        "linkedinProfile": "https://www.linkedin.com/in/johndoe",
