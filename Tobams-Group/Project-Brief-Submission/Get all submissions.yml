info:
  name: Get all submissions
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE}}/project-briefs?page=1&limit=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
