info:
  name: Create a community
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE}}/communities"
  body:
    type: multipart-form
    data:
      - name: photo
        type: file
        value:
          - /Users/fawazabdganiyu/Downloads/IMG_2127.PNG
        contentType: image/png
      - name: communityName
        type: text
        value: Backend Engineers
      - name: industry
        type: text
        value: Information Technology
      - name: description
        type: text
        value: Very beneficial community of developers
      - name: rules
        type: text
        value: '["No discussion of religion or politics", "No disrespects or insults, you will be removed from the group if found guilty", "Posts from companies or promoting paid services (books, courses, tools, events)"]'
  auth:
    type: bearer
    token: "{{admin_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs:
  content: |-
    Creates a community. The creator becomes its sole member and its sole `admin`.

    **Access:** any authenticated role (`ADMIN` additionally needs `AdminPrivilege` SUPER/USER MANAGEMENT/CUSTOMER SERVICE; `SUPER_ADMIN` is unrestricted).

    **Body:** `multipart/form-data` (to include an optional `photo`) or plain JSON (text fields only). `communityName`, `industry` (≤100 chars), `description` (≤1000 chars) are required and trimmed. `rules` is optional — an array of non-blank strings (≤500 chars each); as a multipart text field it may be a JSON-array string or a single plain string (one rule).

    **Duplicate names:** `roomName` must be unique; a second community with the same name is a `409`.

    **Photo (optional):** JPEG/PNG/GIF/WebP, ≤4MB. Uploaded only after the duplicate-name check passes, and removed again if the insert itself then fails — a rejected request never leaves an orphaned object in S3.

    **Errors**
    - `400` validation error, e.g. `communityName: communityName is required; industry: industry is required; description: description is required` (any required field blank).
    - `409` `Community already exists` (duplicate `roomName`).
  type: text/markdown

examples:
  - name: Success
    request:
      url: "{{BASE}}/communities"
      method: POST
      body:
        type: json
        data: |-
          {
              "communityName": "Backend developers",
              "industry": "Information Technology",
              "description": "Very beneficial community of developers",
              "rules": [
                  "No discussion of religion or politics",
                  "No disrespects or insults, you will be removed from the group if found guilty",
                  "Posts from companies or promoting paid services (books, courses, tools, events)"
