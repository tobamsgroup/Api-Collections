              "createdAt": "2026-01-14T08:20:01.328Z",
              "updatedAt": "2026-10-22T09:15:03.102Z"
            }
          }
  - name: "Success (platform admin, photo swap)"
    request:
      url: "{{BASE}}/communities/696751b1c6a42bcbfbbb937d"
      method: PATCH
      params:
        - name: communityId
          value: "696751b1c6a42bcbfbbb937d"
          type: path
      body:
        type: multipart-form
        data:
          - name: photo
            type: file
            value:
              - /Users/fawazabdganiyu/Downloads/new-community-logo.png
            contentType: image/png
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Community updated successfully",
            "data": {
