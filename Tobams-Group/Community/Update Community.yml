  - name: "Forbidden (not a community admin)"
    request:
      url: "{{BASE}}/communities/696751b1c6a42bcbfbbb937d"
      method: PATCH
      params:
        - name: communityId
          value: "696751b1c6a42bcbfbbb937d"
          type: path
      body:
        type: json
        data: |-
          {
            "description": "Trying to edit as a regular member"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "AuthorizationError",
