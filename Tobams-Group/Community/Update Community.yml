          }
  - name: "Bad request (empty body)"
    request:
      url: "{{BASE}}/communities/696751b1c6a42bcbfbbb937d"
      method: PATCH
      params:
        - name: communityId
          value: "696751b1c6a42bcbfbbb937d"
          type: path
      body:
        type: json
        data: |-
          {}
    response:
      status: 400
