info:
  name: Patch Community Status
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{BASE}}/communities/:communityId/status"
  params:
    - name: communityId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "status": "active" | "paused" | "archived" | "deactivated"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
