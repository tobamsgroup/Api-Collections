info:
  name: Get a community by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE}}/communities/:communityId"
  params:
    - name: communityId
      value: 696751b1c6a42bcbfbbb937d
      type: path
  auth:
    type: bearer
    token: "{{talent_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Fetches a single community. Any authenticated user may view any community by id — there's no membership check on this read.

    **Access:** any authenticated role (`ADMIN` additionally needs `AdminPrivilege` SUPER/USER MANAGEMENT/CUSTOMER SERVICE; `SUPER_ADMIN` is unrestricted).

    **Response:** `createdBy` is the creator's resolved profile object, or `null` if that user can no longer be found — never a bare name string. `isMember` reflects whether the caller (always known, since the route requires auth) is in `members`.

    The result is cached (`Caches.getUpdatedProfileById`/`addUpdatedProfile`) and cleared on every update, so a read immediately after an edit elsewhere is consistent, not stale.

    **Path params**
    - `communityId` (24-hex, required — checked in the service, not by route-level `validateParams`).

    **Errors**
    - `400` `Invalid community ID` (malformed id).
    - `404` `Community not found`.
  type: text/markdown

