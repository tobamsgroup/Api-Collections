info:
  name: Get public event detail
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE}}/social_events/public/:eventId"
  params:
    - name: eventId
      value: 6a9950f3568a07e019d1a6e6
      type: path
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        test('returns the public shape and never the private fields', function () {
                const event = res.getBody().data;
                expect(event.title).to.be.a('string');
                expect(event.extra).to.be.a('string');
                expect(event.durationMinutes === null || typeof event.durationMinutes === 'number').to.equal(true);
                expect(['upcoming', 'today', 'past']).to.include(event.status);
                ['userId', 'externalLink'].forEach(function (key) {
                    expect(event).to.not.have.property(key);
                });
            }
        );

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    One event for the **logged-out** event page (title, host, price, date and time, details). **No token needed.** The authenticated screens can use it too; the only thing it cannot give is the viewer's registered state (`isApplied`), which stays on the authenticated `GET /social_events/:eventId`.

    This is an allowlist, not the raw document. **Never returned:** `userId` (the owner) and `externalLink` (the event link, for example a Zoom URL, which would bypass registration).

    - **`isPaid`:** `{ status, currency, price }`. Show "Paid £20.99" when `status` is `true`, otherwise a free label.
    - **`durationMinutes`:** end minus start from `interval.*.date` and `interval.*.time` (`HH:mm` or `h:mm AM/PM`). `11:30` to `12:00` is `30`, for the "(30 min)" label. It is `null` when a time cannot be read or the end is not after the start; omit the label then.
    - **`status`:** `upcoming`, `today` (the event spans today) or `past`. Compared by **UTC day**, so around local midnight it can be a few hours off. Use it to disable "Register For Event" on a `past` event.
    - **`about`, `eventsDetails`, `extra`:** the Event Details tab. `eventsDetails` is a free-form object set by whoever created the event (headings with text or lists, for example key highlights and why attend). `extra` is the closing paragraph shown after them.
    - **`applicantCount`:** registrations so far.

    **Errors:** `400` when `:eventId` is not a 24-character id, `404` when no event has that id. The path `public` is never read as an event id.

    **Existing `GET /social_events/:eventId` and `/with/feedback/:eventId`:** also reachable without a token but return the raw event, including `externalLink` and `userId`. Use these `/public` routes for the logged-out page.
  type: text/markdown

examples:
  - name: Success
    request:
      url: "{{BASE}}/social_events/public/:eventId"
      method: GET
      params:
        - name: eventId
          value: 6a9950f3568a07e019d1a6e6
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": true,
              "message": "Event fetched successfully",
              "data": {
                  "_id": "6a9950f3568a07e019d1a6e6",
                  "title": "Digital Marketing: A zone for ladies",
                  "image": "https://res.cloudinary.com/demo/image/upload/v1/events/chess.png",
                  "eventType": "Webinar",
                  "host": "Tobams Group",
                  "isPaid": {
                      "status": true,
                      "currency": "GBP",
                      "price": 20.99
                  },
                  "timezone": "Europe/London",
                  "location": "Online",
                  "interval": {
                      "start": { "date": "2026-12-02T00:00:00.000Z", "time": "11:30" },
                      "end": { "date": "2026-12-02T00:00:00.000Z", "time": "12:00" }
                  },
                  "durationMinutes": 30,
                  "status": "upcoming",
                  "about": "Welcome to the Sustainable Development Goals (SDGs) event, an inspiring gathering dedicated to advancing global progress.",
                  "description": "A zone for ladies in digital marketing.",
                  "eventsDetails": {
                      "keyHighlights": [
                          "Insightful Discussions",
                          "Innovative Solutions",
                          "Networking Opportunities"
                      ],
                      "whyAttend": [
                          "Gain a deeper understanding of the SDGs",
                          "Collaborate with diverse stakeholders"
                      ]
                  },
                  "extra": "Join us on this journey toward a more sustainable, inclusive, and resilient future. Together, let's transform goals into action and make a lasting difference for generations to come.",
                  "applicantCount": 12,
                  "createdAt": "2026-11-01T09:15:00.000Z"
              }
          }
  - name: Event not found
    request:
      url: "{{BASE}}/social_events/public/:eventId"
      method: GET
      params:
        - name: eventId
          value: 000000000000000000000000
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": false,
              "error": "NotFoundError",
              "message": "Event with id 000000000000000000000000 not found"
          }
  - name: Malformed id
    request:
      url: "{{BASE}}/social_events/public/:eventId"
      method: GET
      params:
        - name: eventId
          value: not-an-id
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": false,
              "error": "ValidationError",
              "message": "eventId: Invalid MongoDB ObjectId"
          }
