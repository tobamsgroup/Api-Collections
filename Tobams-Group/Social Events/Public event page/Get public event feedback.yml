info:
  name: Get public event feedback
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE}}/social_events/public/:eventId/feedback"
  params:
    - name: eventId
      value: 6a9950f3568a07e019d1a6e6
      type: path
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        test('comments carry a display reviewer and no ids or contact data', function () {
                const body = res.getBody();
                expect(body.data).to.be.an('array');
                expect(body.pagination.total).to.be.a('number');
                body.data.forEach(function (comment) {
                    expect(comment.replies).to.be.an('array');
                    ['reviewerId', 'receiverId', 'fullname'].forEach(function (key) {
                        expect(comment).to.not.have.property(key);
                    });
                    if (comment.reviewer !== null) {
                        expect(Object.keys(comment.reviewer).sort()).to.eql(['isAdmin', 'name', 'photo']);
                    }
                });
            }
        );

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Comments for the **Feedback** tab of the event page. **No token needed**. Posting a comment stays on `POST /feedbacks` and replying on `POST /feedbacks/:feedbackId/reply`, both authenticated.

    Newest first, paginated with `page` (default `1`) and `limit` (default `10`, maximum `100`). `pagination.total` is the number of comments, for the "Comments (154)" header. Replies are not counted in it.

    **Comment:** `_id`, `feedback` (the text), `rating` (`1` to `5`, or `null` when none was given), `createdAt` (show it as "1 week ago"), `reviewer`, `replies`.

    **Reply** (oldest first, nested under its comment): `_id`, `feedback`, `createdAt`, `reviewer`.

    **`reviewer`:** `{ name, photo, isAdmin }`.
    - `name` is the full name, or the company name for an organisation with no personal name.
    - `photo` is a URL, or `null` when the user has none (show an initial avatar).
    - `isAdmin` is `true` for platform admins and super admins and drives the **Admin** badge. The raw role is never sent.
    - `reviewer` is `null` when the author's account no longer exists. Show a neutral "Deleted user" instead of a name.

    **Never returned:** reviewer ids, emails, the stored `fullname`, or any event data.

    **Empty:** an event with no feedback is `200` with `data: []` and `pagination.total: 0`. **Errors:** `400` for a malformed `:eventId`, `404` for an unknown event.

    The older `GET /social_events/with/feedback/:eventId` is also reachable without a token, but nests the whole event (including `externalLink` and `userId`) into every row. Use this route instead.
  type: text/markdown

examples:
  - name: Comments with an admin reply
    request:
      url: "{{BASE}}/social_events/public/:eventId/feedback"
      method: GET
      params:
        - name: eventId
          value: 6a9950f3568a07e019d1a6e6
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": true,
              "message": "Event feedback fetched successfully",
              "data": [
                  {
                      "_id": "6a9950f3568a07e019d1b001",
                      "feedback": "Thank You so much sir, you're a great mentor.",
                      "rating": 5,
                      "createdAt": "2026-10-13T10:20:00.000Z",
                      "reviewer": {
                          "name": "Danny Fisher",
                          "photo": "https://res.cloudinary.com/demo/image/upload/v1/avatars/danny.png",
                          "isAdmin": false
                      },
                      "replies": []
                  },
                  {
                      "_id": "6a9950f3568a07e019d1b002",
                      "feedback": "I have a question, please",
                      "rating": null,
                      "createdAt": "2026-10-27T08:00:00.000Z",
                      "reviewer": {
                          "name": "John Doe",
                          "photo": null,
                          "isAdmin": false
                      },
                      "replies": [
                          {
                              "_id": "6a9950f3568a07e019d1b101",
                              "feedback": "Go ahead, please",
                              "createdAt": "2026-10-27T09:30:00.000Z",
                              "reviewer": {
                                  "name": "Jordan Foxx",
                                  "photo": "https://res.cloudinary.com/demo/image/upload/v1/avatars/jordan.png",
                                  "isAdmin": true
                              }
                          }
                      ]
                  }
              ],
              "pagination": {
                  "page": 1,
                  "limit": 10,
                  "total": 2,
                  "pages": 1,
                  "hasNext": false,
                  "hasPrev": false
              }
          }
  - name: No feedback yet
    request:
      url: "{{BASE}}/social_events/public/:eventId/feedback"
      method: GET
      params:
        - name: eventId
          value: 6a9950f3568a07e019d1a6e6
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": true,
              "message": "Event feedback fetched successfully",
              "data": [],
              "pagination": {
                  "page": 1,
                  "limit": 10,
                  "total": 0,
                  "pages": 0,
                  "hasNext": false,
                  "hasPrev": false
              }
          }
  - name: Event not found
    request:
      url: "{{BASE}}/social_events/public/:eventId/feedback"
      method: GET
      params:
        - name: eventId
          value: 000000000000000000000000
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": false,
              "error": "NotFoundError",
              "message": "Event with id 000000000000000000000000 not found"
          }
