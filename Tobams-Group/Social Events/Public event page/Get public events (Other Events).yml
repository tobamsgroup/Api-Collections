info:
  name: Get public events (Other Events)
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE}}/social_events/public"
  params:
    - name: exclude
      value: 6a9950f3568a07e019d1a6e6
      type: query
    - name: limit
      value: "4"
      type: query
    - name: scope
      value: upcoming
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        test('cards only, no private fields, paginated', function () {
                const body = res.getBody();
                expect(body.data).to.be.an('array');
                expect(body.pagination.total).to.be.a('number');
                body.data.forEach(function (card) {
                    expect(card._id).to.be.a('string');
                    ['userId', 'externalLink', 'extra', 'about', 'eventsDetails'].forEach(function (key) {
                        expect(card).to.not.have.property(key);
                    });
                });
            }
        );

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Events for the **Other Events** panel on the event page. **No token needed.** Cards only (no `about`, `description` or `eventsDetails`), with enough for the thumbnail, date line, title and duration.

    | Query | Meaning |
    | --- | --- |
    | `exclude` | An event id to leave out. Send the id of the event being viewed so it never lists itself. |
    | `scope` | `upcoming` (default, soonest first), `past` or `all` (both newest first). Anything else is `400`. |
    | `page` | Default `1`. |
    | `limit` | Default `10`, maximum `100`. |

    Blank values are treated as not sent; a malformed `exclude` is `400`.

    **Response:** `data` is the list of cards, `pagination` is beside it (`page`, `limit`, `total`, `pages`, `hasNext`, `hasPrev`). **An empty result is `200` with `data: []`**, never `404`: render the "No Other Events" screen from an empty `data`. "See All" links to the events list.

    **Card fields:** `_id`, `title`, `image`, `eventType`, `host`, `isPaid`, `timezone`, `location`, `interval`, `durationMinutes`, `status` (`upcoming` / `today` / `past`, by UTC day). `upcoming` includes events happening today. Never returned: `userId`, `externalLink`, `extra`.
  type: text/markdown

examples:
  - name: Other events
    request:
      url: "{{BASE}}/social_events/public?exclude=6a9950f3568a07e019d1a6e6&limit=4"
      method: GET
      params:
        - name: exclude
          value: 6a9950f3568a07e019d1a6e6
          type: query
        - name: limit
          value: "4"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": true,
              "message": "Events fetched successfully",
              "data": [
                  {
                      "_id": "6a9950f3568a07e019d1a6e1",
                      "title": "Digital Marketing: A zone for ladies",
                      "image": "https://res.cloudinary.com/demo/image/upload/v1/events/group.png",
                      "eventType": "Webinar",
                      "host": "Tobams Group",
                      "isPaid": { "status": false, "currency": "NGN", "price": 0 },
                      "timezone": "Africa/Lagos",
                      "location": "Online",
                      "interval": {
                          "start": { "date": "2026-11-03T00:00:00.000Z", "time": "19:00" },
                          "end": { "date": "2026-11-03T00:00:00.000Z", "time": "20:00" }
                      },
                      "durationMinutes": 60,
                      "status": "today"
                  },
                  {
                      "_id": "6a9950f3568a07e019d1a6e2",
                      "title": "Career Growth Clinic",
                      "image": "https://res.cloudinary.com/demo/image/upload/v1/events/clinic.png",
                      "eventType": "Workshop",
                      "host": "Acme Ltd",
                      "isPaid": { "status": true, "currency": "GBP", "price": 15 },
                      "timezone": "Europe/London",
                      "location": "London",
                      "interval": {
                          "start": { "date": "2026-12-12T00:00:00.000Z", "time": "19:00" },
                          "end": { "date": "2026-12-12T00:00:00.000Z", "time": "21:00" }
                      },
                      "durationMinutes": 120,
                      "status": "upcoming"
                  }
              ],
              "pagination": {
                  "page": 1,
                  "limit": 4,
                  "total": 2,
                  "pages": 1,
                  "hasNext": false,
                  "hasPrev": false
              }
          }
  - name: No other events
    request:
      url: "{{BASE}}/social_events/public?exclude=6a9950f3568a07e019d1a6e6"
      method: GET
      params:
        - name: exclude
          value: 6a9950f3568a07e019d1a6e6
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": true,
              "message": "Events fetched successfully",
              "data": [],
              "pagination": {
                  "page": 1,
                  "limit": 10,
                  "total": 0,
                  "pages": 0,
                  "hasNext": false,
                  "hasPrev": false
              }
          }
  - name: Unknown scope
    request:
      url: "{{BASE}}/social_events/public?scope=someday"
      method: GET
      params:
        - name: scope
          value: someday
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
              "success": false,
              "error": "ValidationError",
              "message": "scope: Invalid option: expected one of \"upcoming\"|\"past\"|\"all\""
          }
