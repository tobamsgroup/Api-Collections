        value: '{"status":true,"currency":"GBP","price":20.99}'
      - name: timezone
        type: text
        value: GMT + 1
      - name: location
        type: text
        value: Online
      - name: interval
        type: text
        value: '{"start":{"date":"2026-07-06","time":"11:30"},"end":{"date":"2026-07-06","time":"12:00"}}'
      - name: about
        type: text
        value: A conference to discuss the latest trends in technology.
      - name: eventsDetails
        type: text
        value: '{     "About the Event: Patience and Gratitude": "Welcome to the Sustainable Development Goals (SDGs) event—an inspiring gathering dedicated to advancing global progress and fostering a shared commitment to sustainability. This event serves as a platform for collaboration, innovation, and dialogue, bringing together diverse stakeholders, thought leaders, and change-makers.",     "Key Highlights": [         "Insightful Discussions: Engage in thought-provoking conversations led by experts in sustainable development addressing current challenges and opportunities.",         "Innovative Solutions: Discover groundbreaking projects and solutions that align with the SDGs, driving positive change across various sectors.",         "Networking Opportunities: Connect with like-minded individuals, organizations, and influencers passionate about creating a sustainable future."    ]      }'
      - name: description
        type: text
        value: A deep dive into sustainable business practices.
      - name: extra
        type: text
        value: Join us on this journey toward a more sustainable, inclusive, and resilient future. Together, let's transform goals into action and make a lasting difference for generations to come."
  auth:
    type: bearer
    token: "{{admin_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

