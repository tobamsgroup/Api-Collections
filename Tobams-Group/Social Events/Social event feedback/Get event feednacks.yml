info:
  name: Get event feednacks
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE}}/feedbacks/receiver/:receiverId?type=Events&page=1&limit=20"
  params:
    - name: type
      value: Events
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: receiverId
      value: 6a9950f3568a07e019d1a6e6
      type: path
  auth:
    type: bearer
    token: "{{admin_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

