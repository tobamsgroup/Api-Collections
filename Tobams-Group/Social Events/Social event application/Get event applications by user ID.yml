info:
  name: Get event applications by user ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE}}/social_events/applications/user/67a36e1e79f9a0d10c3ee9eb"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    The applicant's own applications, in **every** payment state, so the frontend can offer "Complete payment" on a `pending` or `failed` one.

    - `paymentStatus`: `paid` (confirmed seat, also every free event), `pending` (paid event, not yet paid), `failed` (the gateway reported a failed charge; can pay again), `disputed` (charged an amount that did not match the quote; seat withheld, the admin has been told; do not pay again). No `paymentStatus` means an application from before payments existed: treat it as `paid`.
  type: text/markdown
