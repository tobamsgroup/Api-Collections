info:
  name: Updaate event application by its ID
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{BASE}}/social_events/applications/67a36e1e79f9a0d10c3ee9eb"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `PATCH /social_events/applications/:applicationId`, the applicant's own application only.

  - Only `fullName`, `emailAddress`, `phoneNumber` and `companyName` can change. Payment fields (`paymentStatus`, `amountPaid`, `paymentReference`, ...) in the body are ignored, so a PATCH can never confirm an unpaid seat.
