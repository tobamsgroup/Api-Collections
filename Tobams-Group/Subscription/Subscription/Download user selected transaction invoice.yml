docs: |-
  ## Download my invoice (payer)

  `GET /subscriptions/transactions/:reference/invoice`. Roles: `Organisation`, `Corporate`, `Admin` (`SUPER` or `JOB POST`), `Super_Admin`. Returns the **caller's own** payment invoice. Admins downloading someone else's invoice use `GET /pay/customer-buckets/transaction/:transactionId/invoice`.

  > **Response changed** with backend PR tobamsgroup/Tobams-Group-BE#921. Before it, a 200 body was the invoice's S3 URL as plain text (under a PDF header), the route needed an active subscription, and admins always got 403 "Subscription not loaded".

  `:reference` is the payment's `referenceId` (from `GET /subscriptions/payment-history`). Works for any successful payment purpose, not only subscriptions. No active subscription is needed, so past invoices stay available after a plan lapses.

  **Success 200: the PDF file itself.** `Content-Type: application/pdf`, `Content-Disposition: attachment; filename="invoice-000123.pdf"`, `X-Invoice-Number`. The number is the same as on the admin copy and on emailed invoices. Read it as a blob (`responseType: 'blob'`), not as text or a URL.

  **Errors** (JSON)
  - 400 payment not successful (pending, failed, provisioned)
  - 403 `Access denied`: someone else's payment, or a guest payment with no account
  - 404 `Payment not found` (the saved "Invalid reference" example shows the old message)
  - 401 no token
