info:
  name: Submit assessment answers and get results
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE}}/assessment/submit"
  body:
    type: json
    data: |-
      {
        "uuid": "TG-60XTA",
        "sessionId": "jane.doe_1776760291236_b47a1107",
        "answers": [
          { "questionId": "q_1697049132_1", "selectedOption": "a" },
          { "questionId": "q_1697049132_2", "selectedOption": "c" }
        ],
        "timeSpent": 1800
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Scores a generated assessment session, saves the submission, and updates the user's assessment status.

    **Access:** public. The user is identified by `uuid` in the body (platform user uuid, or the guest user's id from guest registration).

    **Body** (`AssessmentSubmissionSchema`)

    | Field | Type | Required | Notes |
    | --- | --- | --- | --- |
    | `uuid` | string | yes | Submitter's uuid |
    | `sessionId` | string | yes | The `sessionId` returned by `GET /assessment/generate` |
    | `answers` | array | yes | `[{ questionId: string, selectedOption?: "a" \| "b" \| "c" \| "d" }]`. Omit `selectedOption` for an unanswered question |
    | `timeSpent` | integer | no | Seconds, `>= 0` |

    **Side effects**
    - Pass (score at or above the pass mark for the user's category): certificate generated, outcome email sent with certificate and result link.
    - Fail: retry email sent with the result link.
    - Platform-user Career pass may set nexus eligibility. A guest's pass never does.
    - The session's cached questions are cleared, so a `sessionId` can only be submitted once.

    **Response 201**
    ```json
    {
      "success": true,
      "message": "Assessment submitted and scored successfully",
      "data": {
        "_id": "66f1c2a9e4b0a1b2c3d4e5f6",
        "uuid": "TG-60XTA",
        "sessionId": "jane.doe_1776760291236_b47a1107",
        "answers": [{ "questionId": "q_1697049132_1", "selectedOption": "a" }],
        "timeSpent": 1800,
        "userCategory": "PLATFORM_USER",
        "result": {
          "category": "Career",
          "area": "Backend Development",
          "overallScore": { "percentage": 72, "totalPoints": 79, "earnedPoints": 57 },
          "sectionBreakdown": [{ "section": "APIs", "category": "backend", "percentage": 71, "totalPoints": 7, "earnedPoints": 5, "recommendation": null }],
          "questionResults": [{ "questionId": "q_1697049132_1", "isCorrect": true, "pointsEarned": 2, "explanation": "Correct answer selected" }],
          "criticalGaps": [],
          "strongAreas": ["APIs"],
          "technicalScore": 74,
          "softSkillsScore": 68,
          "nexusEligible": true,
          "proficiency": "Proficient",
          "earnedBadges": [],
          "careerCategoryScores": [],
          "submittedAt": "2026-10-22T09:40:35.368Z"
        },
        "stage": null,
        "certificateUrl": "https://<bucket>.s3.amazonaws.com/certificates/....pdf",
        "nexusEligible": true,
        "courseRecommendation": { }
      }
    }
    ```
    `certificateUrl` is `null` on a fail. `stage` is the user's `talentStage`, or `null`.

    **Errors**
    - `400` body fails validation (missing `uuid`/`sessionId`/`answers`, option outside `a`-`d`, negative `timeSpent`).
    - `404` `User not found`: no user with that `uuid`.
    - `404` `Assessment session not found or expired. Please retake the assessment.`: unknown, expired, or already submitted `sessionId`.
  type: text/markdown

