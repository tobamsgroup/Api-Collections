      url: "{{BASE}}/assessment/submissions/date-range?startDate=2026-10-01&endDate=2026-11-01&minScore=70"
      method: GET
      params:
        - name: startDate
          value: "2026-10-01"
          type: query
        - name: endDate
          value: "2026-11-01"
          type: query
        - name: minScore
          value: "70"
          type: query
