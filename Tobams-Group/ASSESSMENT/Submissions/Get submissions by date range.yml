    request:
      url: "{{BASE}}/assessment/submissions/date-range?startDate=2026-10-01"
      method: GET
      params:
        - name: startDate
          value: "2026-10-01"
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "BadRequestError",
            "message": "Start date and end date are required"
          }
  - name: "Start not before end"
    request:
      url: "{{BASE}}/assessment/submissions/date-range?startDate=2026-10-31&endDate=2026-10-01"
      method: GET
      params:
        - name: startDate
          value: "2026-10-31"
          type: query
        - name: endDate
          value: "2026-10-01"
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "BadRequestError",
            "message": "Start date must be before end date"
          }
