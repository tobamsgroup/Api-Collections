info:
  name: Get user stats by UUID
  type: http
  seq: 8

http:
  method: GET
  url: "{{BASE}}/assessment/submissions/user/:uuid/stats"
  params:
    - name: uuid
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Assessment statistics for one user by uuid. Same shape as `GET /assessment/submissions/my-stats`.

    **Access:** public. No auth.

    **Path params**
    - `uuid` (string, required).

    **Response 200**
    ```json
    {
      "success": true,
      "message": "User statistics retrieved successfully",
      "data": {
        "totalSubmissions": 3,
        "averageScore": 64.3,
        "bestScore": 72,
        "latestSubmission": "2026-10-22T09:40:35.368Z",
        "sectionPerformance": [{ "section": "APIs", "averagePercentage": 66 }],
        "performanceTrend": "improving"
      }
    }
    ```
    `performanceTrend`: `improving`, `declining`, `stable`, or `insufficient_data` (fewer than 2 submissions). Computed from the latest 5 submissions.
  type: text/markdown

examples:
  - name: "Success"
    request:
      url: "{{BASE}}/assessment/submissions/user/TG-60XTA/stats"
      method: GET
      params:
        - name: uuid
          value: "TG-60XTA"
          type: path
