      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "ValidationError",
            "message": "uuid: Invalid input: expected string, received undefined"
          }
  - name: "Blank uuid"
    request:
      url: "{{BASE}}/assessment/submissions/6717a0c4e4b0a1b2c3d4e5f6?uuid="
      method: GET
      params:
        - name: uuid
          value: ""
          type: query
        - name: id
          value: "6717a0c4e4b0a1b2c3d4e5f6"
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "ValidationError",
            "message": "uuid: uuid is required"
          }
