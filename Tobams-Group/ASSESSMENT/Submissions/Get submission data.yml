  - name: "Wrong uuid (same as missing id)"
    request:
      url: "{{BASE}}/assessment/submissions/6717a0c4e4b0a1b2c3d4e5f6?uuid=TG-OTHER"
      method: GET
      params:
        - name: uuid
          value: "TG-OTHER"
          type: query
        - name: id
          value: "6717a0c4e4b0a1b2c3d4e5f6"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "NotFoundError",
            "message": "Assessment submission not found"
          }
  - name: "Malformed id"
    request:
      url: "{{BASE}}/assessment/submissions/123?uuid=TG-60XTA"
      method: GET
      params:
        - name: uuid
          value: "TG-60XTA"
          type: query
        - name: id
          value: "123"
          type: path
    response:
