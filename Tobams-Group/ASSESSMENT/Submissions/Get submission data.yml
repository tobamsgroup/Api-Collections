      statusText: Bad Request
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "ValidationError",
            "message": "id: Invalid MongoDB ObjectId"
          }
  - name: "Missing uuid"
    request:
      url: "{{BASE}}/assessment/submissions/6717a0c4e4b0a1b2c3d4e5f6"
      method: GET
