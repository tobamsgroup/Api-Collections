        "projectTitle": "MediTriage: AI-Powered Patient Triage Assistant",
        "category": "AI Solutions",
        "projectType": "Applications",
        "currentStatus": "Prototype",

        "problemStatement": "Rural clinics in Nigeria face long patient wait times and a shortage of trained triage staff, leading to delayed care for critical cases.",
        "inspiration": "After visiting a understaffed clinic where my grandmother waited six hours to be seen, I wanted to build a tool that helps prioritise patients by urgency.",
        "aiContribution": "The system uses a fine-tuned NLP model to interpret symptom descriptions in local languages and classify patients into urgency tiers, plus a triage recommendation engine.",
        "beneficiaries": "Underserved patients in rural and peri-urban clinics, as well as overworked nurses and community health workers.",
        "impact": "In pilot testing across three clinics, average triage time dropped from 25 minutes to under 5, and critical cases were flagged 3x faster.",

        "pitchDeckUrl": "https://drive.google.com/file/d/1AbCdEfGhIjKlMnOpQrStUv/view",
        "videoUrl": "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
        "additionalLinks": "https://github.com/adaezeo/meditriage",
        "termsAccepted": true,
        "videoSharingConsent": true,
        "webinarId": "6a5fb05bafb6fba76b5a8c53"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

