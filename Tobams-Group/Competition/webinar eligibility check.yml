  url: "{{BASE}}/webinar-applications/eligibility?email=rolatzarza@gmail.com&dateOfBirth=1998-04-15&stateOfResidence=oyo&residencyConfirmed=true&webinarId=6a5fb05bafb6fba76b5a8c53"
  params:
    - name: email
      value: rolatzarza@gmail.com
      type: query
    - name: dateOfBirth
      value: 1998-04-15
      type: query
    - name: stateOfResidence
      value: oyo
      type: query
    - name: residencyConfirmed
      value: "true"
      type: query
    - name: webinarId
      value: 6a5fb05bafb6fba76b5a8c53
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

