info:
  name: Notify Finalists
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/competition-applications/finalists/notify"
  body:
    type: json
    data: |-
      {
        "webinarId": "66f1a2b3c4d5e6f7a8b9c0d1",
        "finalists": [
            {
            "name": "Jane Doe",
            "email": "janedoe@gmail.com"
            },
            {
              "name": "Omokorede Usman",
              "email": "adeyeyeusman@gmail.com"
              }
          ]
      }
  auth:
  type: bearer
  token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

