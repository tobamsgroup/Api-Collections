docs: |-

## Notify Finalists

  This endpoint sends a notification email to a list of competition finalists.

  This endpoint requires administrator authentication using a Bearer access token.

  The following request body fields are required:

  * `webinarId` — The ObjectId of the competition.
  * `finalists` — An array containing the finalists to be notified.
  * `finalists[].name` — The finalist's name.
  * `finalists[].email` — The finalist's email address.

  The endpoint is intended for bulk notification of finalists after the competition finalists have been selected.

  A `200 OK` response is returned when the finalist notification request is successfully processed.
