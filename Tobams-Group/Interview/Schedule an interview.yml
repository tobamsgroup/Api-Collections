docs: |-
  **Ids:** a malformed `jobPostId` or `applicantId` is a 400.

  **Application required:** `applicantId` must have applied to `jobPostId`. Otherwise this is a 404 with `No application found for this applicant on this job post`, and no interview is created. The same 404 covers another company's application. Hiring goes through the application process, so a talent found through Explore Talents has to apply first.

  **Company:** the caller. An organisation can only schedule on its own applications. Admins and super admins may schedule as themselves, or name the owning organisation with `?userId`. A non-admin naming a different id gets a 403.

  **In-house:** an admin scheduling as themselves does so for Tobams Group: `companyName` is `Tobams Group`, and that admin is the interview's company for later updates.

  **Stage:** scheduling moves the application forward to `Interview`. `Hired` stays `Hired`. A `Rejected` applicant is a 400 and no interview is created.

  **No overlaps (BE PR):** refused with **409** when the company already has a `Pending`, `Scheduled` or `Rescheduled` interview overlapping this time on the same day (Africa/Lagos), and nothing is created. The company is the organisation, or the admin when scheduling in-house. `Cancelled` and `Completed` free the slot; back-to-back (10:00-11:00 then 11:00-12:00) is fine. The message names the clash: `An interview is already scheduled from 10:00 AM to 11:00 AM on 2028-03-15. Pick a time that does not overlap it.` A date or time that can't be read, equal start and end times, or an interview over 12 hours is a 400. An `endTime` before `startTime` ends the next day (11:00 PM to 1:00 AM), and is checked against the next morning too. If another schedule for the same company is being written at that moment and doesn't finish within 5 seconds, the answer is **503**: retry. Times may be `10:00 AM` or `10:00`. To schedule several applicants at once use `POST /interviews/schedule/bulk`. Ships with backend branch `fawaz/bulk-interview-scheduling-88e2de`.

  **Meeting link:** none yet, so the response and the scheduling notification have no `meetLink`. It is created when the interview is accepted.

  Later accept, reschedule, complete or cancel changes only the interview's own `status`, never the application's stage.

  ### One active interview per slot (BE PR)

  > Behaviour marked **(BE PR)** ships with backend branch `fawaz/admin-api-findings`; staging shows the old behaviour until it is deployed.

  A schedule request for an applicant, job post, `date` and `startTime` that already has a `Pending`, `Accepted`, `Scheduled` or `Rescheduled` interview answers **409** and creates nothing:
  ```json
  { "success": false, "error": "DuplicateError", "message": "An interview is already Pending for this applicant, job post and time slot (interviewId: 6a…)" }
  ```
  - Retrying a create is safe: the retry gets 409 with the existing id. Read it with `GET /interviews/:interviewId`.
  - `Completed` and `Cancelled` free the slot. Another time or day for the same applicant and post is allowed (several rounds).
  - Not atomic: two requests sent at the same moment can both pass. A reschedule into a held slot is not checked.
  - Interviews **never change status on their own** when the slot passes. A past `Pending` stays `Pending` until someone cancels it; a past `Scheduled` stays until the company marks it `Completed`.
