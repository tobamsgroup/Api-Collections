info:
  name: Update interview status in bulk
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{BASE}}/interviews/bulk"
  body:
    type: json
    data: |-
      {
        "interviewIds": [
          "6721f0c2a1b2c3d4e5f60718",
          "6721f0c2a1b2c3d4e5f60719",
          "6721f0c2a1b2c3d4e5f60720"
        ], // takes 1 to 50 ids. Duplicates are removed
        "status": "Cancelled", // "Cancelled" or "Completed". Any other value returns a 400
        "reason": "Hiring freeze for Q4" // optional. Stored on "Cancelled", ignored on "Completed"
      }
  auth:
    type: bearer
    token: "{{client_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Sample Success
    request:
      url: "{{BASE}}/interviews/bulk"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "interviewIds": [
              "6721f0c2a1b2c3d4e5f60718",
              "6721f0c2a1b2c3d4e5f60719",
              "6721f0c2a1b2c3d4e5f60720"
            ], // takes 1 to 50 ids. Duplicates are removed
            "status": "Cancelled", // "Cancelled" or "Completed". Any other value returns a 400
            "reason": "Hiring freeze for Q4" // optional. Stored on "Cancelled", ignored on "Completed"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "success": true,
            "message": "1 of 3 interviews cancelled",
            "data": {
              "status": "Cancelled",
              "requested": 3,
              "updatedCount": 1,
              "failedCount": 2,
              "updated": [
                { "_id": "6721f0c2a1b2c3d4e5f60718", "status": "Cancelled", "cancellationReason": "Hiring freeze for Q4", "applicant": { "...": "..." }, "company": { "...": "..." } }
              ],
              "failed": [
                { "interviewId": "6721f0c2a1b2c3d4e5f60719", "statusCode": 403, "message": "You are not authorized to update this interview" },
                { "interviewId": "6721f0c2a1b2c3d4e5f60720", "statusCode": 400, "message": "Interview is already cancelled" }
              ]
            }
          }

docs: |-
  **Not on `dev` yet:** this route ships with the job application stages PR. Until that merges, `dev` has no `PATCH /interviews/bulk`.

  **Who:** only each interview's own organisation or applicant. Anyone else, admins included, gets a 403 for that id in `failed`.

  **Rules per id, same as the single update:**

  - `Cancelled`: refused with a 400 if the interview is already `Cancelled` or `Completed`.
  - `Completed`: the interview must be `Scheduled` and the caller must be the organisation, otherwise a 400.

  **Response:** always 200 on a valid body. Read each id's outcome from `data.updated` and `data.failed`; one failure never stops the rest.

  **Notifications:** each company gets one summary of its updated interviews, not one per interview.

  **Cancelling:** if the organisation cancels, the applicant gets an in-app notification and an email with the reason. Applicants aren't notified of their own cancellation.

  **Stage:** this changes only each interview's own `status`. It never reads or changes the application, so the candidate stays at the same stage, and an interview on a post with no application still updates.
