info:
  name: Update interview status
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{BASE}}/interviews/:interviewId"
  params:
    - name: interviewId
      value: 67dd46e8042ec58336e3f783
      type: path
  body:
    type: json
    data: |-
      {
        "status": "Rescheduled",
        "reason": "Hiring panel unavailable on the original date",
        "date": "2026-11-12",
        "startTime": "02:00 PM",
        "endTime": "03:00 PM"
      } 
  auth:
    type: bearer
    token: "{{client_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
