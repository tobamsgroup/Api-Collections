info:
  name: List interviews (admins see all, everyone else only their own)
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE}}/interviews?status=&companyId=&applicantId=&startDate=&endDate=&page=&limit="
  params:
    - name: status
      value: ""
      type: query
      description: Scheduled|Accepted|Completed|Cancelled|Pending|Rescheduled
    - name: companyId
      value: ""
      type: query
      description: Not usable by organisation
    - name: applicantId
      value: ""
      type: query
      description: Not usable either interns or talents
    - name: startDate
      value: ""
      type: query
      description: "YYYY-MM-DD "
    - name: endDate
      value: ""
      type: query
      description: "YYYY-MM-DD "
    - name: page
      value: ""
      type: query
    - name: limit
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{admin_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
