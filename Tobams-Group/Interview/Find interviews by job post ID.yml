  - name: No interviews
    request:
      url: "{{BASE}}/interviews/job/6941a7eef0746ae602693990"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Interviews by job post ID retrieved successfully",
            "data": []
          }
  - name: Malformed id
    request:
      url: "{{BASE}}/interviews/job/not-an-id"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "ValidationError",
            "message": "jobPostId: Invalid MongoDB ObjectId"
          }

docs: |-
  **Who sees what:** same rule as the list. Admins get every interview on the post. Everyone else gets only their own on it, so this never answers 403 for someone else's post.

  **Response:** newest first, not paginated. No interviews is a 200 with `[]`, not a 404. A malformed id is a 400.
