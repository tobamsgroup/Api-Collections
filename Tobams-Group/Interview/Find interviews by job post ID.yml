info:
  name: Find interviews by job post ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{BASE}}/interviews/job/:jobPostId"
  params:
    - name: jobPostId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

