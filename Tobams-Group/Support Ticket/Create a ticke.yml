        type: text
        value: fawaz.abdganiyu@tobamsgroup.com
      - name: category
        type: text
        value: Jobs
        description: "'Account & Login'|Jobs|Mentorship|'Events & Workshops'|'Notifications'|'Contact Support'|Payment & Billing'|'Technical Issue'|Course Access|Other"
      - name: otherCategory
        type: text
        value: ""
        description: Required when category is 'Other', otherwise, optional
        disabled: true
      - name: description
        type: text
        value: Test ticket
      - name: file
        type: file
        value:
          - /Users/fawazabdganiyu/Desktop/Screenshot 2026-08-09 at 19.15.12.png
