info:
  name: Fetch submited tickets
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE}}/support-tickets?page=&limit=&category=&otherCategory=&status=&startDate=&endDate=&search="
  params:
    - name: page
      value: ""
      type: query
    - name: limit
      value: ""
      type: query
    - name: category
      value: ""
      type: query
      description: "'Account & Login'|Jobs|Mentorship|'Events & Workshops'|'Notifications'|'Contact Support'|Payment & Billing'|'Technical Issue'|Course Access|Other"
    - name: otherCategory
      value: ""
      type: query
      description: Required when category is 'Other', otherwise, optional
    - name: status
      value: ""
      type: query
      description: open|in_progress|resolved|closed
    - name: startDate
      value: ""
      type: query
    - name: endDate
      value: ""
      type: query
    - name: search
      value: ""
      type: query
      description: |-
        Matches email, description and otherCategory
        case-insensitively with regex characters escaped
  auth:
    type: bearer
    token: "{{admin_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

