info:
  name: Get platform payment history
  type: http
  seq: 7

http:
  method: GET
  url: "{{BASE}}/pay/customer-buckets/platform-transactions?page=&limit=&status=&provider=&paymentMethod=&purpose=&startDate=&endDate=&search="
  params:
    - name: page
      value: ""
      type: query
    - name: limit
      value: ""
      type: query
    - name: status
      value: ""
      type: query
    - name: provider
      value: ""
      type: query
    - name: paymentMethod
      value: ""
      type: query
    - name: purpose
      value: ""
      type: query
      description: "'assessment'|'project building'|'hosting event'|'join our platform'|'training'|'recruitment'|'subscription only'|'subscription with addOns'|'addOns only'|'hatt_support'|'webinar'|'course'"
    - name: startDate
      value: ""
      type: query
    - name: endDate
      value: ""
      type: query
    - name: search
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{admin_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Get all payment transactions
    request:
      url: "{{BASE}}/pay/customer-buckets/platform-transactions?page=1&limit=20"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "20"
          type: query
    response:
      statusText: "200"
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Platform transactions retrieved successfully",
            "data": {
              "data": [
                {
                  "transactionId": "5431609472",
                  "customerId": "CUS_lykvx7wemeqk8x1",
                  "userId": "68e65ef6014bf70ef70f063b",
                  "userEmail": "customer@example.com",
                  "userName": "John Doe", 
                  "serviceProvider": "paystack",
                  "amount": 110000,
                  "currency": "NGN",
                  "paymentStatus": "success",
                  "purpose": "Subscription",
                  "paymentMethod": "card",
                  "createdAt": "2025-10-15T11:06:35.929Z"
                }
              ],
              "total": 1,
