info:
  name: Get all blog categories — admin list with blog counts
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE}}/blog/category?page=1&limit=10&search=career&sortBy=blogCount&sortOrder=desc"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: search
      value: career
      type: query
    - name: sortBy
      value: blogCount
      type: query
    - name: sortOrder
      value: desc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
