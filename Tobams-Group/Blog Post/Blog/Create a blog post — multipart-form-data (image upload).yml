docs: |
  Notes:
  - `categories` must arrive as either a JSON-stringified array (since multipart can't send real arrays) or comma-separated — `e.g. categories: "Career Advice,6553f1a2b2c3d4e5f6a7b8c9"` also works. Each entry is either an existing category's ObjectId or a brand-new name to create on the fly.
  - `status` is optional, defaults to `"draft"`.
  - `url` must match `^[a-z0-9]+(?:-[a-z0-9]+)*$` (lowercase, hyphens only).
  - `file` is the image, handled by `express-fileupload` — not part of the JSON body.
