info:
  name: Get all Mentor Sessions
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE}}/mentor_session/mentees?pageNumber=1&limit=10"
  params:
    - name: pageNumber
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{intern_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

