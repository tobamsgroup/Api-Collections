  - name: No sessions
    request:
      url: "{{BASE}}/mentor_session/mentees?pageNumber=1&limit=10"
      params:
        - name: pageNumber
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "All intern mentor sessions retrieved successfully",
            "data": {
              "sessions": [],
              "count": 0
            }
          }
  - name: Bad pageNumber
    request:
      url: "{{BASE}}/mentor_session/mentees?pageNumber=0&limit=10"
      params:
        - name: pageNumber
          value: "0"
          type: query
        - name: limit
          value: "10"
          type: query
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "ValidationError",
            "message": "pageNumber: pageNumber must be 1 or more"
          }
  - name: Role not allowed
    description: "Mentor, organisation, or an admin without SUPER"
    request:
      url: "{{BASE}}/mentor_session/mentees?pageNumber=1&limit=10"
      params:
        - name: pageNumber
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
      method: GET
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "AuthorizationError",
            "message": "Restricted Action, Unauthorized Access❗"
          }

docs: |-
  Lists the calling intern's or talent's sessions, every status, past and future, newest first.
  
  **Who can call:** `INTERN` or `TALENT`, `Super_Admin`, or `ADMIN` with the `SUPER` privilege. Lists are always the caller's own sessions, so an admin gets only sessions carrying the admin's own id (normally none).
  
  **Query:**
  
  | Param | Notes |
  | --- | --- |
  | `pageNumber` | Optional, from 1. Defaults to 1 when `limit` is set. |
  | `limit` | Optional, 1 to 100. Leave it out to get the whole list. |
  
  Anything that isn't a positive whole number, or a `limit` over 100, is a 400.
  
  **`count`** is the caller's total for this list, so `Math.ceil(count / limit)` is the page count.
  
  **Rows:** the stored session. There is no mentor profile on the row; `mentorId` is a plain id.
