info:
  name: Get all Upcoming Mentorship Session
  type: http
  seq: 6

http:
  method: GET
  url: "{{BASE}}/mentor_session/upcoming?pageNumber=1&limit=10"
  params:
    - name: pageNumber
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{mentor_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{BASE}}/mentor_session/upcoming?pageNumber=1&limit=10"
      params:
        - name: pageNumber
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Upcoming mentor sessions retrieved successfully",
            "data": {
              "sessions": [
                {
                  "_id": "67dcb34298f81f4f8ce1123f",
                  "agenda": "Portfolio review and next steps",
                  "mentorId": "67b66148ad4271308086ad89",
                  "menteeId": "67b65c0c2478ee6593c49846",
                  "meetingLink": "https://meet.google.com/qjz-fwyr-miy",
                  "eventId": "5k2j8f0q1v9r3m7c4n6b0a1d2e",
                  "status": "Accepted",
                  "date": "2026-11-23T00:00:00.000Z",
                  "time": "10:00 AM - 11:00 AM",
                  "notes": [
                    "Discuss project progress"
                  ],
                  "cancelled": false,
                  "initiatedBy": "Intern"
                }
              ],
              "count": 1
            }
          }
  - name: No sessions
    request:
      url: "{{BASE}}/mentor_session/upcoming?pageNumber=1&limit=10"
      params:
        - name: pageNumber
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Upcoming mentor sessions retrieved successfully",
            "data": {
              "sessions": [],
              "count": 0
            }
          }
  - name: Bad limit
    request:
      url: "{{BASE}}/mentor_session/upcoming?pageNumber=1&limit=101"
      params:
        - name: pageNumber
          value: "1"
          type: query
        - name: limit
          value: "101"
          type: query
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "ValidationError",
            "message": "limit: limit must be 100 or less"
          }
  - name: Role not allowed
    description: "Intern, talent, organisation, or an admin without SUPER"
    request:
      url: "{{BASE}}/mentor_session/upcoming?pageNumber=1&limit=10"
      params:
        - name: pageNumber
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
      method: GET
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "AuthorizationError",
            "message": "Restricted Action, Unauthorized Access❗"
          }

docs: |-
  Lists the calling mentor's sessions dated now or later, soonest first. Cancelled sessions are left out (they are under cancelled). `date` is compared with the current instant, so a session stored at midnight UTC today already counts as past.
  
  Upcoming, past and cancelled never overlap, and together they are the full list. `Declined` and `Rejected` sessions are not cancelled, so they stay under upcoming or past by date.
  
  **Who can call:** `MENTOR`, `Super_Admin`, or `ADMIN` with the `SUPER` privilege. Lists are always the caller's own sessions, so an admin gets only sessions carrying the admin's own id (normally none).
  
  **Query:**
  
  | Param | Notes |
  | --- | --- |
  | `pageNumber` | Optional, from 1. Defaults to 1 when `limit` is set. |
  | `limit` | Optional, 1 to 100. Leave it out to get the whole list. |
  
  Anything that isn't a positive whole number, or a `limit` over 100, is a 400.
  
  **`count`** is the caller's total for this list, so `Math.ceil(count / limit)` is the page count.
  
  **Rows:** the stored session without `createdAt`/`updatedAt`, and without a `mentee` profile (`GET /mentor_session/` has it).
