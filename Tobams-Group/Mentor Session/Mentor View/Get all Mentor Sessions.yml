docs: |-
  Lists the calling mentor's sessions, every status, past and future.
  
  **Who can call:** `MENTOR`, or `ADMIN` with the `SUPER` privilege. `Super_Admin` is not in the route's role list, so it gets a 403. An admin gets the sessions where the admin's own id is on the session, normally none.
  
  **Query:**
  
  | Param | Notes |
  | --- | --- |
  | `pageNumber` | Page, from 1. Leave out both params to get every session. `0` or a negative number is a 500 (MongoDB rejects a negative skip). |
  | `limit` | Page size. No maximum. |
  
  Neither param is validated, and there is no sort, so order is MongoDB's natural order (usually oldest created first).
  
  **`count` is not the caller's total.** It is the number of sessions in the whole collection, every mentor and mentee, so don't use it for pagination.
  
  **Rows:** the stored session plus `mentee`, the mentee's profile summary (name, email, photo, occupation, bio, location, role, skills). `mentee` is missing when the mentee's account no longer exists.
