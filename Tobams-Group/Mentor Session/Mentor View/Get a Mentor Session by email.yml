info:
  name: Get a Mentor Session by email
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE}}/mentor_session/email/:email"
  params:
    - name: email
      value: johndoe@example.com
      type: path
  auth:
    type: bearer
    token: "{{mentor_access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    description: "Newest first"
    request:
      url: "{{BASE}}/mentor_session/email/:email"
      params:
        - name: email
          value: johndoe@example.com
          type: path
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Mentor session retrieved successfully",
            "data": [
              {
                "_id": "67dcb34298f81f4f8ce11240",
                "agenda": "Portfolio review and next steps",
                "mentorId": "67b66148ad4271308086ad89",
                "menteeId": "67b65c0c2478ee6593c49846",
                "meetingLink": "https://meet.google.com/qjz-fwyr-miy",
                "eventId": "5k2j8f0q1v9r3m7c4n6b0a1d2e",
                "status": "Cancelled",
                "date": "2026-11-10T00:00:00.000Z",
                "time": "10:00 AM - 11:00 AM",
                "notes": [
                  "Discuss project progress"
                ],
                "cancelled": true,
                "initiatedBy": "Intern",
                "whyCancel": "Family emergency",
                "createdAt": "2026-11-16T09:00:00.000Z",
                "updatedAt": "2026-11-17T12:30:00.000Z"
              },
              {
                "_id": "67dcb34298f81f4f8ce1123f",
                "agenda": "Portfolio review and next steps",
                "mentorId": "67b66148ad4271308086ad89",
                "menteeId": "67b65c0c2478ee6593c49846",
                "meetingLink": "https://meet.google.com/qjz-fwyr-miy",
                "eventId": "5k2j8f0q1v9r3m7c4n6b0a1d2e",
                "status": "Accepted",
                "date": "2026-11-23T00:00:00.000Z",
                "time": "10:00 AM - 11:00 AM",
                "notes": [
                  "Discuss project progress"
                ],
                "cancelled": false,
                "initiatedBy": "Intern",
                "createdAt": "2026-11-16T09:00:00.000Z",
                "updatedAt": "2026-11-17T12:30:00.000Z"
              }
            ]
          }
  - name: No account or no sessions
    request:
      url: "{{BASE}}/mentor_session/email/:email"
      params:
        - name: email
          value: nobody@example.com
          type: path
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Mentor session retrieved successfully",
            "data": []
          }
  - name: Role not allowed
    description: "Intern, talent, organisation, or an admin without SUPER"
    request:
      url: "{{BASE}}/mentor_session/email/:email"
      params:
        - name: email
          value: johndoe@example.com
          type: path
      method: GET
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": "AuthorizationError",
            "message": "Restricted Action, Unauthorized Access❗"
          }

docs: |-
  Lists the calling mentor's sessions with one mentee, found by the mentee's account email.
  
  `:email` is trimmed and lowercased, then matched against account emails. An email with no account, or a mentee with no sessions with this mentor, is `200` with `data: []`. Not paginated; newest first.
  
  **Who can call:** `MENTOR`, `Super_Admin`, or `ADMIN` with the `SUPER` privilege. An admin gets only sessions where the admin is the mentor (normally none).
  
  **Response:** `data` is an array of stored sessions (no `mentee` profile).
